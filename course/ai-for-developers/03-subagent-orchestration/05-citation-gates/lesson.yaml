workspace:
  image: academy-workspace:dev
  starter: starter
checks:
  - id: citation-gate
    title: "Проверка на стыке: check_findings и check_synthesis отклоняют ровно находки, нарушающие G1-G4, на 235 случайных находках в 5 случайных снимках"
    kind: command
    run: 'python3 -I "$ACADEMY_CHECKS_DIR/verify_citation_gate.py"'
    timeoutSec: 120
    weight: 2
  - id: gate-wired
    title: "Проверки на каждом стыке пайплайна: ни роль, ни отчёт не получают плохую находку, каждая отклонённая в журнале, хорошие доходят без изменений"
    kind: command
    run: 'python3 -I "$ACADEMY_CHECKS_DIR/verify_gate_wired.py"'
    timeoutSec: 240
    weight: 2
  - id: cascade-quiz
    title: "Квиз: где проверка видит отчёт субагента и что говорят исследования о месте проверки"
    kind: quiz
    file: quiz.yaml
    passScore: 0.8
    weight: 1
