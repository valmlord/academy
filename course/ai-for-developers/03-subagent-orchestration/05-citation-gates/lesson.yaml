id: orch-citation-gates
title: "Цитаты и перекрёстные проверки на стыках"
type: artifact
outcomes:
  - "Пишет детерминированную проверку на стыке. Она пропускает дальше только находки с проверяемой цитатой (существующий файл снимка, строка в диапазоне, цитата с этой строки) и итоговые находки, сводимые к принятым исходным. Ставит её так, чтобы ни одна роль и ни одно поле отчёта не получили непроверенную находку, и выбирает, где проверка исполняется в headless- и интерактивном режиме."
estimatedMinutes: 100
status: ready
prerequisites:
  - orch-fan-out
sources:
  - title: "Anthropic: How we built our multi-agent research system (Hadfield и др., 2025-06-13; CitationAgent: identify specific locations for citations)"
    url: https://www.anthropic.com/engineering/multi-agent-research-system
    checkedAt: "2026-11-03"
  - title: "claude.com blog: Building multi-agent systems: When and how to use them (Cara Phillips и др., 2026-01-23; verification subagents: marking outputs as passing without thorough testing; один источник одного вендора)"
    url: https://claude.com/blog/building-multi-agent-systems-when-and-how-to-use-them
    checkedAt: "2026-11-03"
