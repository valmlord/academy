    explanation: "Контракт роли нарушен, и харнесс этого не остановил: в agents.json ревьюеру дали Bash. Что вызов сделал ревьюер безопасности, видно только по дереву: последним перед этой строкой стартовал ревьюер тестов. В MAST ближе всего FM-1.2 (Disobey role specification). Исправление: tools ревьюера без Bash."
