id: final-booking-page
title: "Итоговый проект: страница бронирования на Nuxt"
type: project
outcomes:
  - "Делает страницу бронирования с клиентом, сгенерированным из контракта: закоммиченный файл типов совпадает с перегенерацией закреплёнными версиями генератора."
  - "Настраивает страницу так, что она на сервере отрисовывает слоты из API на местную дату в часовом поясе приглашённого, включая день перевода часов, и проксирует /api/ на бэкенд, адрес которого задаётся при сборке."
  - "Пишет к странице E2E-сценарии для локального запуска (бронирование, занятый слот, дата перевода часов); их оценивает рубрика по коду сценариев и приложенному выводу."
estimatedMinutes: 105
status: ready
prerequisites:
  - final-api-bookings
workspace:
  image: academy-workspace:dev
  starter: starter
