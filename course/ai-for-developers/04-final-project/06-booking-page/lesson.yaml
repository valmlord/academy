checks:
  - id: client-in-sync
    title: "frontend/app/api/schema.d.ts совпадает с перегенерацией из contract/ (openapi-typescript 7.13.0, typescript 5.9.3)"
    kind: command
    run: 'python3 -I "$ACADEMY_CHECKS_DIR/verify_client_sync.py"'
    timeoutSec: 120
    weight: 2
  - id: page-ssr
    title: "Собранная страница отрисовывает на сервере слоты из API в поясе приглашённого и проксирует /api/"
    kind: command
    run: 'python3 -I "$ACADEMY_CHECKS_DIR/verify_page.py"'
    timeoutSec: 600
    weight: 3
  - id: ui-rubric
    title: "Поток бронирования, клиент только через сгенерированные типы, компонентный тест и E2E-сценарии (оценка ментора по рубрике)"
    kind: rubric
    rubric: checks/rubric.md
    artifacts:
      - frontend/app/**/*.vue
      - frontend/app/**/*.ts
      - frontend/test/**/*
      - frontend/e2e/**/*
      - frontend/nuxt.config.ts
      - docs/e2e-run.md
    passScore: 0.7
    weight: 1
