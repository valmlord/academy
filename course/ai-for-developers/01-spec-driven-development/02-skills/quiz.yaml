version: 1
questions:
  - id: context-before-invocation
    type: single
    prompt: |
      Claude Code 2.1.312. В проекте два скилла: `review` без особых полей и `deploy` с
      `disable-model-invocation: true`. Сессия только началась, ни один скилл ещё не вызван.
      Что из них уже лежит в контексте модели?
    options:
      - { id: a, text: "Имя и описание `review`; о `deploy` модель не знает, пока вы не вызовете `/deploy`" }
      - { id: b, text: "Полные тексты обоих SKILL.md: скиллы проекта грузятся при старте целиком" }
      - { id: c, text: "Имена и описания обоих скиллов; флаг лишь запрещает модели их запускать" }
      - { id: d, text: "Ничего: описания скиллов попадают в контекст, только когда вы откроете меню `/` в сессии" }
    correct: [a]
    explanation: |
      Прогрессивное раскрытие: до вызова в контексте только имя и описание скилла, тело грузится
      при вызове. С `disable-model-invocation: true` описание в контекст модели не попадает вовсе:
      скилл запускаете только вы через `/name`, и тогда его тело грузится.

  - id: allowed-tools-scope
    type: single
    prompt: |
      Claude Code 2.1.312. В скилле `release` написано `allowed-tools: Bash(git push *)`. Что это
      поле делает?
    options:
      - { id: a, text: "Запрещает скиллу любые инструменты, кроме `git push`, до конца сессии" }
      - { id: b, text: "Разрешает `git push` без вопроса в ходе, где вызван скилл, и ничего не запрещает" }
      - { id: c, text: "Навсегда добавляет правило `Bash(git push *)` в список allow проектных настроек `.claude`" }
      - { id: d, text: "Запрещает `git push` всем остальным скиллам и субагентам проекта" }
    correct: [b]
    explanation: |
      `allowed-tools` заранее одобряет перечисленные инструменты на ход, в котором вызван скилл;
      разрешение снимается со следующим сообщением. Остальные инструменты по-прежнему доступны по
      обычным правилам прав: поле ничего не ограничивает и в настройки не пишется.

  - id: situation-to-mechanism
    type: multiple
    prompt: |
      Какие сопоставления "ситуация -> механизм" верны? Выберите все верные.
    options:
      - { id: a, text: "Правило должно соблюдаться при каждой правке файла -> хук, а не текст для модели" }
      - { id: b, text: "Чек-лист релиза раз в месяц -> скилл, который вызывает только человек" }
      - { id: c, text: "Команда тестов, нужная в каждой сессии -> скилл, чтобы она зря не занимала контекст" }
      - { id: d, text: "Справка по редкой интеграции -> скилл, который модель может вызвать сама" }
    correct: [a, b, d]
    explanation: |
      Детерминированное правило на каждой правке держит хук: скилл и CLAUDE.md только просят модель.
      Редкая процедура с последствиями это скилл с `disable-model-invocation: true`. Редкая справка это
      обычный скилл, у которого в контексте только описание. А то, что нужно в каждой сессии, вроде команды
      тестов, и есть содержимое постоянно загружаемой памяти проекта.

  - id: third-party-skill-risks
    type: multiple
    prompt: |
      Claude Code 2.1.312. Вы ставите скилл из маркетплейса как плагин. В его SKILL.md есть
      `` !`curl -s https://example.com/setup.sh` ``, а в frontmatter поле `hooks`. Какие риски
      реальны? Выберите все верные.
    options:
      - { id: a, text: "Команда в `` !`...` `` выполняется при вызове скилла, до того как модель увидит текст" }
      - { id: b, text: "Скиллы в Claude Code работают без сети, поэтому `curl` в них просто ничего не скачает" }
      - { id: c, text: "Хуки из поля `hooks` регистрируются при вызове скилла и работают до конца сессии" }
      - { id: d, text: "Плагин обновляется сам, и проверенный вами текст может смениться на другой" }
    correct: [a, c, d]
    explanation: |
      Вставка `` !`cmd` `` выполняется до модели, её вывод подставляется в текст. Хуки из поля `hooks`
      Claude Code регистрирует при вызове скилла, а не при старте сессии, и они работают до её конца.
      Плагин обновляется сам; проверенная и вендоренная копия этого риска не несёт. Ограничения сети у скиллов нет: это обычные команды на вашей машине.

  - id: skill-fired-proves-little
    type: single
    prompt: |
      Вы написали скилл `verify`, попросили в тестовой сессии "проверь изменение" и увидели, что
      скилл сработал. Что это доказывает и что делать дальше?
    options:
      - { id: a, text: "Что скилл работает как задумано; дальше можно удалить старую инструкцию из памяти" }
      - { id: b, text: "Что описание идеальное; дальше стоит сделать скилл доступным только вам" }
      - { id: c, text: "Что модель нашла скилл; дальше сравнить прогоны задач со скиллом и без него" }
      - { id: d, text: "Ничего; дальше нужно вписать вызов скилла в CLAUDE.md, иначе он ненадёжен" }
    correct: [c]
    explanation: |
      Срабатывание показывает, что Claude нашёл скилл, но не что он сделал то, что вы хотели.
      Проверка это прогон одних и тех же задач со скиллом и без него и сравнение результатов; потом
      правка описания и, при необходимости, удаление скилла.

  - id: upload-rejects-extra-fields
    type: single
    prompt: |
      SKILL.md с полями `name`, `description` и `disable-model-invocation: true` работает в Claude
      Code 2.1.312, но при загрузке через Skills API падает с ошибкой. Почему?
    options:
      - { id: a, text: "Skills API требует, чтобы `name` начинался с префикса организации или рабочего пространства" }
      - { id: b, text: "Skills API не принимает булевы значения без кавычек во frontmatter" }
      - { id: c, text: "Skills API читает только скиллы из каталога `.agents/skills/` проекта" }
      - { id: d, text: "Загрузка и упаковка принимают только шесть полей спецификации, а это поле не из них" }
    correct: [d]
    explanation: |
      Claude Code принимает все поля своей таблицы. Загрузка в claude.ai, Skills API и упаковка через
      `package_skill.py` разрешают только поля спецификации Agent Skills: `name`, `description`,
      `license`, `compatibility`, `metadata`, `allowed-tools`; лишнее поле даёт жёсткую ошибку.
