version: 1
questions:
  - id: money-equality
    type: single
    prompt: |
      В модели есть `Money` (сумма в центах и валюта) - объект-значение. Два объекта `Money(1500,
      "EUR")` созданы в разных местах кода. Равны ли они и почему?
    options:
      - { id: a, text: "Равны: объект-значение сравнивается по значению, своей идентичности у него нет" }
      - { id: b, text: "Не равны: это два разных объекта, и у каждого своя идентичность в системе" }
      - { id: c, text: "Равны, только если оба получены из одного и того же Invoice" }
      - { id: d, text: "Не равны, пока у каждого из них нет собственного идентификатора в базе" }
    correct: [a]
    explanation: |
      Сущность различают по идентичности, объект-значение - по значению всех его атрибутов. Две
      суммы 15.00 EUR взаимозаменяемы, поэтому равны.

  - id: aggregate-transaction
    type: single
    prompt: |
      Invoice - корень агрегата, строки счёта входят в агрегат, Customer - отдельный агрегат. Что
      правильно менять в одной транзакции?
    options:
      - { id: a, text: "Новую строку Invoice и адрес Customer, раз оба нужны в одном письме" }
      - { id: b, text: "Новую строку Invoice и его итог: оба внутри одного агрегата Invoice" }
      - { id: c, text: "Все Invoice одного Customer сразу, чтобы итоги всегда совпадали" }
      - { id: d, text: "Строку одного Invoice и строку другого Invoice того же Customer" }
    correct: [b]
    explanation: |
      Граница агрегата - граница согласованности: транзакция меняет один агрегат через его корень.
      Строка и итог одного Invoice - внутри границы; другой Invoice или Customer - другие агрегаты,
      их согласуют событиями.

  - id: polyseme-across-contexts
    type: single
    prompt: |
      Для отдела продаж "account" - это клиентская учётная запись, для бухгалтерии - счёт из плана
      счетов. Обе части живут в одном репозитории. Что делать со словом?
    options:
      - { id: a, text: "Выбрать одно значение для всей системы и переобучить второй отдел" }
      - { id: b, text: "Писать в коде `account` везде, а значение пояснять в комментариях" }
      - { id: c, text: "Развести по контекстам: в одном это термин, в другом слово в `_Avoid_`" }
      - { id: d, text: "Запретить слово в обоих контекстах и придумать для них два новых синонима" }
    correct: [c]
    explanation: |
      Слово, которое значит разное в разных частях системы, разводят по ограниченным контекстам:
      там, где оно термин, его определяют; там, где оно путает, его избегают и называют свой термин.

  - id: avoided-word-consequences
    type: multiple
    prompt: |
      Глоссарий велит избегать `client`, а в спецификации и в именах тестов везде `client`. Какие
      последствия для работы с агентом реальны? Выберите все верные.
    options:
      - { id: a, text: "Агент продолжит словарь `client` в новом коде, и названий станет ещё больше" }
      - { id: b, text: "Claude Code откажется запускать тесты, пока их имена не совпадут с глоссарием" }
      - { id: c, text: "Поиск по термину Customer пропустит эти тесты и строки спецификации" }
      - { id: d, text: "Ничего: модель всегда сама сопоставляет синонимы с терминами глоссария" }
    correct: [a, c]
    explanation: |
      Агент берёт словарь из того, что видит; запрещённое слово в спецификации и тестах размножается,
      а поиск по термину их не находит. Сам Claude Code глоссарий не проверяет и ничего не блокирует;
      синонимы модель сопоставляет не всегда.

  - id: glossary-loading-cost
    type: multiple
    prompt: |
      Claude Code 2.1.312, настройки по умолчанию. Какие утверждения о способах дать глоссарий агенту
      верны? Выберите все верные.
    options:
      - { id: a, text: "Импорт `@GLOSSARY-MAP.md` в CLAUDE.md грузит карту в каждую сессию при старте" }
      - { id: b, text: "Импорт через `@` экономит контекст: файл читается, только когда он агенту понадобится" }
      - { id: c, text: "Правило в `.claude/rules/` с `paths:` грузится, когда Claude работает с этими файлами" }
      - { id: d, text: "В скилле, который модель вызывает сама, до вызова в контексте только описание" }
    correct: [a, c, d]
    explanation: |
      Импорт раскрывается при загрузке CLAUDE.md, поэтому файл грузится при старте и контекст не
      экономит. Правило с `paths:` грузится по требованию; у скилла до вызова в контексте только имя и
      описание.

  - id: grilling-facts-are-agents-job
    type: single
    prompt: |
      Во время grilling агент спрашивает эксперта: "Где в коде объявлена таблица счетов?" Как это
      оценить?
    options:
      - { id: a, text: "Хорошо: агент не гадает, а уточняет у человека, который знает систему" }
      - { id: b, text: "Хорошо, если к вопросу приложен рекомендуемый ответ с путём к файлу" }
      - { id: c, text: "Плохо: такие вопросы задают после интервью, а не во время него" }
      - { id: d, text: "Плохо: факты из кода агент находит сам, у человека спрашивают решения" }
    correct: [d]
    explanation: |
      В grilling искать факты - работа агента, никогда не пользователя; человеку задают вопросы о
      решениях, с рекомендуемым ответом, и решает он.
