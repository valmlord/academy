# Reserve pool for the mentor review after verification-quiz is closed (design 2.5, as 00 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: verification-quiz
passBar: "passScore 0.8: at least 5 of 6 correct, exact set match per question"
questions:
  - id: claim-without-output
    type: single
    prompt: |
      Агент пишет: "Запустил тесты, всё зелёное". Команды и её вывода в записи сессии нет. Что вы
      на самом деле знаете о тестах?
    options:
      - { id: a, text: "Что они зелёные: агент запускал их сам и сообщил результат" }
      - { id: b, text: "Ничего: это утверждение, доказательство это команда вместе с её выводом" }
      - { id: c, text: "Что они зелёные, если Stop-хук проекта не заблокировал этот ход" }
      - { id: d, text: "Что они зелёные на машине агента, но могут упасть в CI" }
    correct: [b]
    explanation: |
      Доказательство это команда и её вывод в записи. Фраза агента без них это заявление. Даже
      пропуск Stop-хука говорит только о том, что проверял хук, а не о том, что написал агент.

  - id: tautology-spotting
    type: single
    prompt: |
      Какой тест не может упасть на неверной реализации `late_fee` с потолком 10%?
    options:
      - { id: a, text: "`assertEqual(late_fee(10_000, 400), 1_000)`" }
      - { id: b, text: "`assertEqual(late_fee(10_005, 500), 1_000)`" }
      - { id: c, text: "`assertRaises(ValueError)` для `late_fee(0, 30)`" }
      - { id: d, text: "`assertEqual(late_fee(a, d), min(a * (d - 5) // 1000, a // 10))`" }
    correct: [d]
    explanation: |
      Последний тест считает ожидаемое значение той же формулой, что и код: он повторяет реализацию и
      совпадёт с ней при любой ошибке в формуле. Ожидаемые значения берутся из требований, посчитанные
      заранее.

  - id: zero-tests-not-green
    type: single
    prompt: |
      Хук решает по коду выхода `python3 -m unittest discover`: 0 значит зелёные тесты. В проекте
      тесты перестали находиться, и unittest пишет "Ran 0 tests". Что сделает такой хук на Python 3.11?
    options:
      - { id: a, text: "Заблокирует: unittest возвращает ненулевой код, когда тестов нет" }
      - { id: b, text: "Упадёт с исключением и заблокирует по onFailure" }
      - { id: c, text: "Пропустит: на 3.11 unittest при нуле тестов выходит с кодом 0" }
      - { id: d, text: "Пропустит, но только если stop_hook_active равен true" }
    correct: [c]
    explanation: |
      На Python 3.11 "Ran 0 tests" завершается с кодом 0, на 3.12 с кодом 5. Хук, который читает только
      код выхода, на 3.11 примет ноль тестов за зелёные. Надёжнее искать строку "Ran 0 tests".

  - id: raw-output-missing-file
    type: single
    prompt: |
      Claude Code 2.1.312. Хук пересылает сырой вывод unittest в stderr и выходит с кодом 2, stdout
      пустой. Красный тест упал с `FileNotFoundError`. Что произойдёт?
    options:
      - { id: a, text: "Остановка заблокируется, причина это весь stderr" }
      - { id: b, text: "Claude Code сочтёт это неблокирующей ошибкой: в stderr фраза о ненайденном файле" }
      - { id: c, text: "Claude Code остановит сессию целиком из-за ошибки файла" }
      - { id: d, text: "Хук перезапустится с stop_hook_active: true" }
    correct: [b]
    explanation: |
      На Stop при exit 2 с пустым stdout и stderr, где сказано, что файла нет, Claude Code считает
      запуск неблокирующей ошибкой. Красный прогон пройдёт незамеченным. JSON-блок в stdout с причиной
      не зависит от этой фразы.

  - id: who-has-last-word
    type: multiple
    prompt: |
      Какие проверки срабатывают, даже если агент в своей сессии их отключил или обошёл? Выберите все
      верные.
    options:
      - { id: a, text: "Обязательная проверка CI на ветке с защитой от слияния без неё" }
      - { id: b, text: "Stop-хук в `.claude/settings.json`, который агент может отредактировать" }
      - { id: c, text: "Скрытые приёмочные тесты, которые запускает проверка вне рабочей папки" }
      - { id: d, text: "Просьба в CLAUDE.md всегда запускать тесты перед ответом" }
    correct: [a, c]
    explanation: |
      CI с защитой ветки и скрытые тесты запускает не тот, кого проверяют. Файл настроек в рабочей
      папке агент может изменить, если права это позволяют, а CLAUDE.md только просит.

  - id: mutant-meaning
    type: multiple
    prompt: |
      Проверка сообщает "выжил мутант: REQ-03, округление к ближайшему вместо округления вниз". Что
      из этого следует? Выберите все верные.
    options:
      - { id: a, text: "Ни один ваш тест не отличает округление вниз от округления к ближайшему" }
      - { id: b, text: "Ваша реализация округляет неверно" }
      - { id: c, text: "Нужен тест с входом, где эти два округления дают разный результат" }
      - { id: d, text: "Требование REQ-03 сформулировано неоднозначно" }
    correct: [a, c]
    explanation: |
      Мутант это копия кода с одной намеренной ошибкой. Выжил он значит, что тесты на нём зелёные:
      им не хватает входа, который различает поведение. О вашей реализации это сообщение ничего не
      говорит; её проверяют приёмочные тесты.
