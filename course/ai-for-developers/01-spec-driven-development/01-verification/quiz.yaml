version: 1
questions:
  - id: goal-reads-the-transcript
    type: single
    prompt: |
      В Claude Code 2.1.312 вы ставите цель `/goal все тесты проходят`. Агент правит код и в конце
      пишет сводку "Ran 14 tests ... OK", но тесты он не запускал: строку он придумал. Снимется ли
      цель и почему?
    options:
      - { id: a, text: "Нет: /goal сам запускает тесты проекта и видит, что они красные" }
      - { id: b, text: "Да: /goal читает запись сессии и ничего не запускает, придуманной строки хватает" }
      - { id: c, text: "Нет: /goal требует вызова Bash в той же сессии, иначе цель не снимается" }
      - { id: d, text: "Да, но только если Stop-хук проекта тоже разрешит остановку на этом ходе" }
    correct: [b]
    explanation: |
      /goal оценивает выполнение условия по записи сессии и ничего не исполняет сам. Строка вывода,
      которую агент написал, а не получил от команды, выглядит для него так же, как настоящая.
      Детерминированной проверку делает механизм, который сам запускает команду: Stop-хук или CI.

  - id: what-makes-done-deterministic
    type: multiple
    prompt: |
      Какие механизмы делают "готово" детерминированным, то есть решение о завершении принимает
      запущенная проверка, а не модель? Выберите все верные.
    options:
      - { id: a, text: "Stop-хук типа command, который сам запускает тесты и блокирует остановку на красных" }
      - { id: b, text: "Цель /goal с формулировкой \"все тесты проходят и линтер чист\"" }
      - { id: c, text: "Обязательная проверка CI, без которой ветку нельзя влить" }
      - { id: d, text: "Stop-хук типа prompt, который просит другую модель оценить ответ агента" }
    correct: [a, c]
    explanation: |
      Stop-хук типа command и обязательная проверка CI сами исполняют команду и решают по её коду
      выхода и выводу. /goal читает запись сессии, а хук типа prompt или agent отдаёт решение другой
      модели: это полезные сигналы, но не исполнение проверки.

  - id: enforce-not-ask
    type: multiple
    prompt: |
      Агент поменял ожидаемое значение в тесте, чтобы красный тест стал зелёным. Какие меры не
      дадут такой правке пройти, даже если агент не послушается? Выберите все верные.
    options:
      - { id: a, text: "Правило deny или PreToolUse-хук, который блокирует правки в файлах тестов" }
      - { id: b, text: "Строка в CLAUDE.md: \"никогда не меняй тесты, чтобы они прошли\"" }
      - { id: c, text: "Скрытые приёмочные тесты, которых агент не видит и не может править" }
      - { id: d, text: "Цель /goal \"все тесты проходят, файлы тестов не изменены\"" }
    correct: [a, c]
    explanation: |
      Deny-правило и хук исполняет харнесс, а скрытые тесты агент не может подогнать. Строка в
      CLAUDE.md это просьба к модели, а /goal решает по записи сессии и ничего не запускает сам. Повторный
      прогон в CI здесь тоже не помог бы: он запустит уже исправленный тест, и тот будет зелёным.

  - id: stop-hook-loop
    type: single
    prompt: |
      Claude Code 2.1.312. Stop-хук блокирует остановку, пока линтер находит нарушение, а нарушение
      агент исправить не может: оно в файле, который ему запрещено менять. Хук блокирует снова и
      снова. Что должен проверять сам хук, чтобы не держать агента в таком цикле?
    options:
      - { id: a, text: "Поле last_assistant_message: если агент пишет, что всё готово, пропускать" }
      - { id: b, text: "Число строк в transcript_path: после сотой строки пропускать остановку" }
      - { id: c, text: "Поле cwd: если оно не равно корню проекта, хук не блокирует" }
      - { id: d, text: "Поле stop_hook_active: при true хук уже блокировал, и второй раз не надо" }
    correct: [d]
    explanation: |
      На повторной остановке после блокировки Claude Code передаёт `stop_hook_active: true`. Хук,
      который в этом случае пропускает остановку, не зацикливается на условии, которое не
      разрешится. У Claude Code есть и свой предел подряд идущих продолжений, но опираться на
      `stop_hook_active` должен сам хук.

  - id: stop-hook-crash-fails-open
    type: single
    prompt: |
      В модуле 00 PreToolUse-хук был зарегистрирован с `onFailure: "block"`. Вы так же
      регистрируете Stop-хук, а он падает с исключением на входе, который не смог разобрать. Что
      будет в Claude Code 2.1.312?
    options:
      - { id: a, text: "Ход закончится: на Stop onFailure ни на что не влияет, упавший хук пропускает" }
      - { id: b, text: "Остановка заблокируется: onFailure: \"block\" превращает падение в блок" }
      - { id: c, text: "Claude Code перезапустит хук до трёх раз и только потом решит" }
      - { id: d, text: "Сессия остановится целиком, как при continue: false в выводе хука" }
    correct: [a]
    explanation: |
      Для Stop `onFailure` не действует: упавший хук это неблокирующая ошибка, и ход заканчивается
      (fail open). Поэтому хук сам разбирает вход аккуратно: нечитаемый stdin он считает
      `stop_hook_active: false` и всё равно запускает тесты.

  - id: first-run-green
    type: single
    prompt: |
      Вы написали тест до кода, как в TDD, и запустили его. Он зелёный с первого запуска. Какой
      вывод правильный?
    options:
      - { id: a, text: "Отлично: реализация уже верна, можно переходить к следующему тесту" }
      - { id: b, text: "Нужно запустить тест ещё раз: первый зелёный прогон бывает случайным" }
      - { id: c, text: "Тест пока ничего не доказал: проверьте, может ли он вообще упасть" }
      - { id: d, text: "Значит, тест надо пометить skip, пока не появится реализация" }
    correct: [c]
    explanation: |
      Тест, который зелёный без реализации, либо проверяет то, что уже было, либо не может упасть
      (тавтология, ожидаемое значение посчитано тем же кодом). Красный шаг и есть доказательство,
      что тест способен поймать ошибку. Сломайте поведение и убедитесь, что тест краснеет.
