version: 1
questions:
  - id: one-line-fix-no-full-flow
    type: single
    prompt: |
      Найден баг: в одной функции перепутан знак сравнения, исправление - одна строка. Нужно ли
      проходить весь путь SDD: интервью, спецификация, ADR, задачи?
    options:
      - { id: a, text: "Да: SDD имеет смысл, только если применять его к каждому изменению" }
      - { id: b, text: "Нет: хватит теста, который воспроизводит баг, и правки; SDD для фич с решениями" }
      - { id: c, text: "Да, но без интервью: спецификация и ADR всё равно нужны и для однострочной правки" }
      - { id: d, text: "Нет: баги вообще не описывают в артефактах, тесты к ним тоже не нужны" }
    correct: [b]
    explanation: |
      Один процесс на любой размер изменения - главная критика SDD ("кувалда"). Для однострочной
      правки достаточно красного теста, который воспроизводит баг, и исправления.

  - id: spec-first-vs-anchored
    type: single
    prompt: |
      Команда пишет спецификацию перед каждой фичей, а после слияния ветки удаляет её: "код уже
      есть". Какой это уровень SDD?
    options:
      - { id: a, text: "Spec-first: спецификация ведёт работу, но не живёт дальше вместе с кодом" }
      - { id: b, text: "Spec-anchored: спецификация хранится и меняется вместе с кодом" }
      - { id: c, text: "Spec-as-source: человек правит только спецификацию, а код генерируется из неё" }
      - { id: d, text: "Никакой: удалённая после слияния спецификация не считается SDD" }
    correct: [a]
    explanation: |
      Spec-first: спецификация написана до кода и используется для задачи. Spec-anchored: она
      остаётся и меняется вместе с кодом. Spec-as-source: источником остаётся только спецификация.

  - id: testable-requirements
    type: multiple
    prompt: |
      Какие строки требований можно проверить тестом? Выберите все верные.
    options:
      - { id: a, text: "WHEN остаток по счёту меньше 500 центов THE SYSTEM SHALL не планировать напоминание" }
      - { id: b, text: "THE SYSTEM SHALL быстро и надёжно обрабатывать все напоминания по просроченным счетам клиентов" }
      - { id: c, text: "WHEN счёт просрочен на 7 дней и напоминаний не было THE SYSTEM SHALL запланировать первое" }
      - { id: d, text: "THE SYSTEM SHALL корректно работать с напоминаниями во всех случаях" }
    correct: [a, c]
    explanation: |
      Проверяемое требование называет условие и наблюдаемый результат с числами. "Быстро",
      "надёжно", "корректно" без меры тестом не проверить.

  - id: which-decisions-get-an-adr
    type: multiple
    prompt: |
      Правило: ADR пишут для решения, которое трудно отменить, И которое удивит без контекста, И
      которое результат настоящего компромисса. Какие решения его заслуживают? Выберите все верные.
    options:
      - { id: a, text: "Поднять таймаут HTTP-клиента с 5 до 10 секунд после жалоб на обрывы" }
      - { id: b, text: "Связать сервисы очередью событий, а не REST: команда ждёт REST, переделка дорогая" }
      - { id: c, text: "Переименовать модуль `utils` в `helpers`, чтобы название было понятнее новым людям" }
      - { id: d, text: "Хранить файлы по хешу содержимого, а не по имени: неожиданно, миграция тяжёлая" }
    correct: [b, d]
    explanation: |
      Таймаут и переименование легко отменить, и компромисса в них нет. Очередь вместо REST и
      адресация по хешу трудно отменить, они удивят нового человека и меняют одни свойства на другие.

  - id: layer-sliced-tasks
    type: single
    prompt: |
      Задачи нарезаны по слоям: "T-01 модели, T-02 репозиторий, T-03 API, T-04 тесты". Агент делает
      по одной задаче за сессию. Что пойдёт не так?
    options:
      - { id: a, text: "Ничего: слои независимы, поэтому каждую задачу можно сдать отдельно" }
      - { id: b, text: "Агент сделает все задачи сразу в первой сессии, потому что видит их в одном файле" }
      - { id: c, text: "Ни одна сессия до последней не даёт работающего поведения, которое можно проверить" }
      - { id: d, text: "Задачи придётся делать в обратном порядке, начиная с API" }
    correct: [c]
    explanation: |
      Горизонтальная нарезка откладывает проверку до конца: до T-04 нет поведения, которое можно
      прогнать, и ошибки стыков всплывают последними. Вертикальный срез даёт проверяемый результат в
      каждой задаче.

  - id: fresh-session-after-spec
    type: single
    prompt: |
      Вы провели интервью с агентом и записали SPEC.md. Зачем начинать реализацию в новой сессии?
    options:
      - { id: a, text: "Новая сессия дешевле: у неё нет истории, поэтому токены вообще не считаются" }
      - { id: b, text: "Старую сессию нельзя продолжить после записи файла в репозиторий" }
      - { id: c, text: "Без новой сессии агент не сможет прочитать SPEC.md с диска" }
      - { id: d, text: "Контекст чист от поисков интервью, и работа идёт только по спецификации" }
    correct: [d]
    explanation: |
      После интервью контекст забит разговором и пробами. В новой сессии агент работает по
      спецификации как по единственному входу, и пробелы в ней становятся видны.
