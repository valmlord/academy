# Reserve pool for the mentor review after sdd-quiz is closed (design #41 2.5, 00 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: sdd-quiz
passBar: "at least 5 of 6 correct (passScore 0.8), exact set match per question"
questions:
  - id: adr-numbers-not-reused
    type: single
    prompt: |
      ADR-0004 оказался неверным, его решение отменили. Какой номер получит новый ADR?
    options:
      - { id: a, text: "0004: старый файл удаляют, и его номер освобождается для нового решения" }
      - { id: b, text: "Следующий свободный; ADR-0004 получает статус superseded и остаётся" }
      - { id: c, text: "0004a, чтобы новый стоял рядом со старым" }
      - { id: d, text: "Новый ADR не нужен: достаточно исправить текст ADR-0004" }
    correct: [b]
    explanation: |
      Номера ADR не переиспользуют. Отменённое решение получает статус "superseded by" и остаётся
      как история.

  - id: seam-count
    type: single
    prompt: |
      Шаблон спецификации требует назвать шов, через который тестируют фичу. Сколько их в идеале?
    options:
      - { id: a, text: "Один: тесты бьют в одну точку, внутренности можно менять" }
      - { id: b, text: "По одному на каждую публичную функцию модуля, чтобы тестировать их отдельно" }
      - { id: c, text: "Столько, сколько слоёв в приложении" }
      - { id: d, text: "Ни одного: тесты читают внутреннее состояние напрямую" }
    correct: [a]
    explanation: |
      Идеальное число швов - один: тесты проверяют поведение через публичный интерфейс и не
      ломаются при рефакторинге внутренностей.

  - id: prd-vs-spec
    type: single
    prompt: |
      Чем спецификация из урока отличается от PRD "для бизнеса"?
    options:
      - { id: a, text: "Ничем: это одно и то же, просто PRD длиннее и в нём больше текста для бизнеса и менеджеров" }
      - { id: b, text: "PRD пишет агент, спецификацию - только человек" }
      - { id: c, text: "В ней есть проверяемые требования с идентификаторами, шов и решения по тестам" }
      - { id: d, text: "Спецификация, в отличие от PRD, вообще не содержит пользовательских историй" }
    correct: [c]
    explanation: |
      Спецификация упражнения - артефакт для реализации и проверки: требования с id, шов, решения
      по тестам и то, что вне рамок.

  - id: task-carries-check
    type: single
    prompt: |
      Зачем в каждой задаче строка `Check:` с командой?
    options:
      - { id: a, text: "Она нужна только для красоты отчёта" }
      - { id: b, text: "По ней Claude Code сам закрывает задачу в трекере без участия человека" }
      - { id: c, text: "Она заменяет тесты: если команда есть, тесты не нужны" }
      - { id: d, text: "Готовность задачи доказывает вывод команды, а не слова агента" }
    correct: [d]
    explanation: |
      Задача несёт требования и команду проверки: "готово" подтверждается выводом команды.

  - id: sdd-criticism
    type: multiple
    prompt: |
      Какие претензии к SDD звучат в практике? Выберите все верные.
    options:
      - { id: a, text: "Один тяжёлый процесс на изменения любого размера" }
      - { id: b, text: "Усталость от горы markdown-файлов, которые никто не читает" }
      - { id: c, text: "Ложное чувство контроля: документ есть, а проверки нет" }
      - { id: d, text: "SDD прямо запрещает писать тесты до кода, поэтому TDD с ним несовместим" }
    correct: [a, b, c]
    explanation: |
      Критика: "кувалда" для мелких изменений, markdown fatigue, ложный контроль. Запрета на
      тесты в SDD нет.

  - id: vertical-slice-signs
    type: multiple
    prompt: |
      Какие признаки вертикальной задачи? Выберите все верные.
    options:
      - { id: a, text: "После неё есть наблюдаемое поведение, которое можно проверить" }
      - { id: b, text: "Она затрагивает ровно один слой приложения, например только модели" }
      - { id: c, text: "Она помещается в одну свежую сессию агента" }
      - { id: d, text: "В ней сразу все требования спецификации" }
    correct: [a, c]
    explanation: |
      Вертикальный срез проходит через нужные слои и даёт проверяемое поведение, при этом он
      небольшой: одна свежая сессия.
