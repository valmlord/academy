version: 1
questions:
  - id: checks-without-a-model
    type: multiple
    prompt: |
      Какие проверки целостности артефактов можно поставить в pre-commit-хук или в CI так, чтобы
      решение принимал детерминированный код, без вызова модели? Выберите все верные.
    options:
      - { id: a, text: "`openspec validate --strict` по структуре изменений и спецификаций" }
      - { id: b, text: "Spec Kit `analyze`, который ищет расхождения спецификации, плана и задач" }
      - { id: c, text: "Свой линтер трассировки: требование, задача, метка в имени теста" }
      - { id: d, text: "Субагент-ревьюер, который сверяет код со спецификацией и пишет отчёт" }
    correct: [a, c]
    explanation: |
      `openspec validate` и свой линтер правил C1-C6 это код с кодом выхода: один и тот же вход даёт
      один и тот же результат. `analyze` в Spec Kit и ревьюер-субагент выполняет модель: их находки
      полезны, но решение по ним принимает человек, а не хук.

  - id: reversed-decision-old-adr
    type: single
    prompt: |
      Через полгода команда отказывается от решения ADR-0003 и принимает другое. Что происходит с
      ADR-0003?
    options:
      - { id: a, text: "Его удаляют, чтобы агент не прочитал устаревшее решение" }
      - { id: b, text: "Его текст переписывают под новое решение, номер остаётся прежним" }
      - { id: c, text: "Его переименовывают в черновик и убирают из нумерации" }
      - { id: d, text: "Он остаётся, его статус становится superseded by нового ADR" }
    correct: [d]
    explanation: |
      ADR не переписывают и не удаляют: новое решение получает новый номер, а старое остаётся в
      истории со статусом `superseded by ADR-NNNN`. Так видно, что решали раньше и почему
      передумали, а номера никогда не переиспользуются.

  - id: requirement-id-reuse
    type: single
    prompt: |
      Новое правило полностью заменяет требование REQ-04. Как оформить это в спецификации?
    options:
      - { id: a, text: "Новое правило получает новый id; REQ-04 и ссылки на него обновляют явно" }
      - { id: b, text: "Новый текст записывают под id REQ-04, раз старое правило больше не действует" }
      - { id: c, text: "Новое правило получает id REQ-04a, чтобы было видно, что оно его заменяет" }
      - { id: d, text: "Id не важен: тесты и задачи всё равно ссылаются на текст требования" }
    correct: [a]
    explanation: |
      Id требования это ссылка, на которую опираются задачи и метки тестов. Если записать под старым
      id другое поведение, старые тесты с меткой `req_04` молча станут проверять не то. Новый id и
      явное обновление ссылок оставляют расхождение видимым для линтера.

  - id: stop-hook-vs-ci
    type: single
    prompt: |
      Линтер артефактов подключён к Stop-хуку агента и к CI. Агент в своей сессии видит находку,
      а ход всё равно заканчивается. Кто в этой схеме решает окончательно, можно ли влить изменения?
    options:
      - { id: a, text: "Stop-хук: если он хоть раз пропустил остановку, изменения считаются принятыми" }
      - { id: b, text: "Агент: он видел вывод линтера и может объяснить, почему находка неважна" }
      - { id: c, text: "Обязательная проверка CI на ветке: она запускается вне сессии агента" }
      - { id: d, text: "Линтер в pre-commit на машине разработчика, его нельзя обойти" }
    correct: [c]
    explanation: |
      Stop-хук держит агента внутри сессии и может пропустить остановку (например, при
      `stop_hook_active`). Pre-commit можно отключить локально. Последнее слово у обязательной
      проверки CI и защиты ветки: её запускает не тот, кого проверяют.

  - id: converged-proves
    type: single
    prompt: |
      Spec Kit `converge` сообщает "Converged" для вашей фичи. Что это доказывает?
    options:
      - { id: a, text: "Что код проходит все тесты, которые перечислены в задачах фичи" }
      - { id: b, text: "Что модель не нашла расхождений; это находка для человека, не доказательство" }
      - { id: c, text: "Что каждое требование спецификации покрыто хотя бы одним тестом" }
      - { id: d, text: "Что спецификация, план и задачи совпадают символ в символ с шаблоном" }
    correct: [b]
    explanation: |
      `converge` выполняет модель: её ответ "Converged" значит, что в этом прогоне она расхождений не
      увидела. Тесты он не запускает и трассировку не проверяет детерминированно; это сигнал, который
      человек принимает или проверяет, а не доказательство.

  - id: what-a-linter-cannot-catch
    type: multiple
    prompt: |
      Какие расхождения детерминированный линтер правил C1-C6 не поймает? Выберите все верные.
    options:
      - { id: a, text: "Тест с меткой req_05 на самом деле проверяет поведение другого требования" }
      - { id: b, text: "Задача со Status: done перечисляет требование, у которого нет ни одного теста" }
      - { id: c, text: "Текст требования противоречит решению, записанному в принятом ADR" }
      - { id: d, text: "Код реализует правило иначе, чем написано в требовании" }
    correct: [a, c, d]
    explanation: |
      Линтер проверяет структуру, нумерацию, ссылки, метки и словарь, то есть то, что видно в
      тексте. Смысл ему недоступен: что именно проверяет тест, согласуется ли требование с ADR,
      делает ли код то, что написано. Это ловят тесты против мутантов, ревью и человек. Задача без
      теста с меткой это правило C3, его линтер ловит.
