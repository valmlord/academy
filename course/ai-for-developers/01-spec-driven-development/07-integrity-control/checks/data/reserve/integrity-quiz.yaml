# Reserve pool for the mentor review after integrity-quiz is closed (design 2.5, as 00 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: integrity-quiz
passBar: "passScore 0.8: at least 5 of 6 correct, exact set match per question"
questions:
  - id: spec-anchored-order
    type: single
    prompt: |
      Пришёл запрос на изменение поведения. В каком порядке меняются артефакты при подходе
      spec-anchored?
    options:
      - { id: a, text: "Код, потом тесты, потом спецификация по факту сделанного" }
      - { id: b, text: "Тесты, потом код, а спецификацию обновит отдельная задача позже" }
      - { id: c, text: "Спецификация с новым требованием, потом задачи, тесты и код" }
      - { id: d, text: "Код и спецификация одновременно, тесты после ревью" }
    correct: [c]
    explanation: |
      Спецификация остаётся опорой: новое требование с новым id, затем задача, которая его
      перечисляет, тест с его меткой и код. Тогда линтер видит изменение на каждом шаге.

  - id: c3-meaning
    type: single
    prompt: |
      Линтер пишет `C3 docs/tasks.md: REQ-07`. Что это значит?
    options:
      - { id: a, text: "REQ-07 нет в спецификации, а задача на него ссылается" }
      - { id: b, text: "Задача со Status: done перечисляет REQ-07, а теста с меткой req_07 нет" }
      - { id: c, text: "REQ-07 не перечислено ни в одной задаче" }
      - { id: d, text: "В тексте REQ-07 есть слово, которого глоссарий велит избегать" }
    correct: [b]
    explanation: |
      C3: у каждого требования выполненной задачи есть тест с его меткой. C1 про требование без задачи,
      C2 про ссылку на несуществующее требование, C6 про словарь.

  - id: superseded-citation
    type: single
    prompt: |
      ADR-0002 получил статус `superseded by ADR-0004`. В `docs/tasks.md` осталась строка
      "см. ADR-0002". Что сделает линтер правил C1-C6?
    options:
      - { id: a, text: "Сообщит C5: задачи ссылаются на заменённый ADR" }
      - { id: b, text: "Ничего: ссылки на ADR в задачах не проверяются" }
      - { id: c, text: "Сообщит C4: нумерация ADR нарушена" }
      - { id: d, text: "Сообщит C2: задача ссылается на несуществующий документ" }
    correct: [a]
    explanation: |
      C5 запрещает спецификации и задачам ссылаться на заменённые и устаревшие ADR. Сам заменяющий ADR
      может упоминать тот, который заменяет.

  - id: hook-forwards-both-streams
    type: single
    prompt: |
      Stop-хук запускает линтер и при ненулевом коде выхода кладёт в причину только stdout линтера.
      Линтер завершился с кодом 2, потому что в корне нет `GLOSSARY-MAP.md`. Что увидит агент?
    options:
      - { id: a, text: "Сообщение линтера об отсутствующем файле" }
      - { id: b, text: "Ничего: хук пропустит остановку при коде 2" }
      - { id: c, text: "Список всех нарушений C1-C6" }
      - { id: d, text: "Блок с пустой причиной: ошибка разбора идёт в stderr, а его хук не переслал" }
    correct: [d]
    explanation: |
      Находки линтер пишет в stdout, ошибки запуска и разбора в stderr. Хук, который пересылает один
      поток, теряет половину сообщений: в причине должны быть оба.

  - id: deterministic-what
    type: multiple
    prompt: |
      Что из перечисленного детерминированный линтер артефактов может проверить? Выберите все верные.
    options:
      - { id: a, text: "Номера ADR идут подряд с 0001 и не повторяются" }
      - { id: b, text: "Требование описывает то поведение, которое на самом деле нужно бизнесу" }
      - { id: c, text: "Каждое требование спецификации перечислено хотя бы в одной задаче" }
      - { id: d, text: "В именах тестов нет слов, которых глоссарий велит избегать" }
    correct: [a, c, d]
    explanation: |
      Нумерация, ссылки и словарь видны в тексте и проверяются кодом. Нужно ли бизнесу именно это
      поведение, решает человек.

  - id: avoid-in-russian-text
    type: multiple
    prompt: |
      Глоссарий велит избегать слова `client`. Какие строки требования линтер с резолвером урока
      пометит? Выберите все верные.
    options:
      - { id: a, text: "WHEN клиент просрочил оплату THE SYSTEM SHALL ..." }
      - { id: b, text: "WHEN счёт выставлен clients из списка THE SYSTEM SHALL ..." }
      - { id: c, text: "WHEN поле clientId пустое THE SYSTEM SHALL ..." }
      - { id: d, text: "WHEN Customer (он же client) не платит THE SYSTEM SHALL ..." }
    correct: [b, d]
    explanation: |
      Токены это последовательности латинских букв: `clients` совпадает с `client` по правилу
      множественного числа, `client` в скобках это отдельный токен. `клиент` латинских букв не
      содержит, а `clientId` даёт один токен `clientid`, который с `client` не совпадает.
