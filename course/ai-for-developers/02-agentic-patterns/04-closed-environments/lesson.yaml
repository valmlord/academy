checks:
  - id: contour-config
    title: "Настройки Claude Code и окружения выполняют требования брифа закрытого контура"
    kind: command
    run: 'python3 -I "$ACADEMY_CHECKS_DIR/verify_contour.py"'
    timeoutSec: 30
    weight: 3
  - id: closed-environments-quiz
    title: "Квиз: флаги по факту наличия, веб-инструменты, strictAllowlist, локальная модель, SOCKS, слабая модель"
    kind: quiz
    file: quiz.yaml
    passScore: 0.8
    weight: 1
