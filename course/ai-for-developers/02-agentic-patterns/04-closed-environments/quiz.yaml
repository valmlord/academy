version: 1
questions:
  - id: nonessential-traffic-zero
    type: single
    prompt: |
      В `~/.claude/settings.json` у коллеги в `env` стоит
      `"CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"`. Он хочет вернуть необязательный трафик и
      меняет значение на `"0"`. Что получится в Claude Code 2.1.314?
    options:
      - { id: a, text: "Трафик включится: `0` выключает переменную, как у любого флага" }
      - { id: b, text: "Трафик останется выключенным: эту переменную включает любое непустое значение" }
      - { id: c, text: "Claude Code не запустится: `0` не входит в допустимые значения" }
      - { id: d, text: "Трафик включится, но только после перезапуска терминала, в котором задан этот `env`" }
    correct: [b]
    explanation: |
      `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` в списке переменных, которые проверяются только на
      наличие: любое непустое значение, `0` тоже, включает поведение. Выключают его, убрав переменную
      или оставив пустое значение. Слова `0`, `false`, `no`, `off` выключают только переменные вида
      "включить или выключить", а эта не из них.

  - id: web-fetch-env-keeps-search
    type: single
    prompt: |
      В закрытом контуре в `env` настроек проекта задали `"CLAUDE_CODE_DISABLE_WEB_FETCH": "1"` и
      больше ничего про веб-инструменты не меняли. Что остаётся у агента в Claude Code 2.1.314?
    options:
      - { id: a, text: "Ничего веб: эта переменная убирает сразу оба инструмента, и WebFetch, и WebSearch" }
      - { id: b, text: "WebFetch, но каждый запрос будет спрашивать разрешение" }
      - { id: c, text: "Ничего веб, пока песочница включена со строгим списком хостов" }
      - { id: d, text: "WebSearch: переменная убирает только WebFetch, поиск надо запретить в deny" }
    correct: [d]
    explanation: |
      По справке переменная выключает только WebFetch, "WebSearch остаётся доступным". Чтобы убрать
      поиск, нужен deny с голым именем `WebSearch` (или шаблоном имени, который его покрывает): голое
      имя убирает инструмент из контекста целиком. Песочница ограничивает команды Bash, а не
      веб-инструменты агента.

  - id: strict-allowlist-in-project
    type: single
    prompt: |
      В `.claude/settings.json` репозитория стоит `sandbox.network.strictAllowlist: true` и
      `allowedDomains: ["pypi.corp.local"]`. Сессия Claude Code 2.1.314 идёт в режиме разрешений
      Manual. Команда в песочнице обращается к `files.example.com`. Что произойдёт?
    options:
      - { id: a, text: "Появится запрос: строгий список действует только из пользовательских настроек" }
      - { id: b, text: "Запрос будет отклонён без вопроса: строгий список запрещает всё, чего в нём нет" }
      - { id: c, text: "Запрос пройдёт: список хостов в проектных настройках игнорируется целиком" }
      - { id: d, text: "Сессия не запустится, пока строгий список не перенесут в локальные настройки" }
    correct: [a]
    explanation: |
      `strictAllowlist` из `.claude/settings.json` или `.claude/settings.local.json` репозитория не
      действует; он работает из пользовательских, управляемых настроек или из `--settings`. Без
      него хост вне списка только не разрешён заранее, и дальше решает режим: в Manual приходит
      запрос, и одно нажатие расширяет доступ. Отказ без вопроса во всех режимах даёт только строгий
      список там, где он действует.

  - id: socks-only-proxy
    type: single
    prompt: |
      Сеть банка выпускает наружу только через SOCKS-прокси. Администратор просит настроить
      Claude Code 2.1.314 на этот прокси. Какое утверждение подтверждает документация?
    options:
      - { id: a, text: "Нужно задать `HTTPS_PROXY=socks5://...`, и Claude Code пойдёт через него" }
      - { id: b, text: "Нужно задать `ALL_PROXY=socks5://...`: только эту переменную Claude Code читает для SOCKS" }
      - { id: c, text: "Claude Code не поддерживает SOCKS-прокси; через этот прокси он работать не будет" }
      - { id: d, text: "SOCKS работает, если добавить CA прокси в `NODE_EXTRA_CA_CERTS`" }
    correct: [c]
    explanation: |
      Страница сетевой настройки прямо говорит: "Claude Code does not support SOCKS proxies". Способа
      обойти это документация не даёт; для прокси со сложной аутентификацией (NTLM, Kerberos) она
      предлагает шлюз LLM. `NODE_EXTRA_CA_CERTS` про доверие сертификатам, а не про протокол прокси.

  - id: local-open-weight-model
    type: multiple
    prompt: |
      Команда хочет вместо шлюза к Claude подключить Claude Code 2.1.314 к локальной open-weight
      модели через Ollama, который отвечает в формате Anthropic Messages API. Что из этого верно?
      Выберите все верные.
    options:
      - { id: a, text: "Это работает по документации Ollama, но Anthropic такую схему не поддерживает" }
      - { id: b, text: "Это поддерживаемый провайдер: его включает одна из переменных `CLAUDE_CODE_USE_*`" }
      - { id: c, text: "Стоит ждать больше выдуманных пакетов и API, поэтому проверки нужны чаще" }
      - { id: d, text: "WebFetch перестанет отправлять имя хоста на `api.anthropic.com`" }
    correct: [a, c]
    explanation: |
      Локальная модель за Claude Code работает по документации Ollama, vLLM или llama.cpp, но
      Anthropic "doesn't support routing Claude Code to non-Claude models through any gateway".
      Переменные `CLAUDE_CODE_USE_*` включают облачных провайдеров (Bedrock, Vertex, Foundry, Claude
      Platform on AWS, Mantle), а не локальный сервер: его задают через `ANTHROPIC_BASE_URL`. WebFetch
      перед загрузкой по-прежнему отправляет имя хоста на `api.anthropic.com`, куда бы ни шли запросы
      к модели. Эту проверку отключает `skipWebFetchPreflight: true`, а
      `CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` на неё не влияет. Слабые модели чаще выдумывают
      пакеты и API, отсюда больше и раньше датчиков.

  - id: weaker-model-process
    type: multiple
    prompt: |
      В контуре доступна только локальная модель заметно слабее Claude, и веб-поиска у агента нет.
      Какие изменения процесса разумны? Выберите все верные.
    options:
      - { id: a, text: "Запускать тесты и линтеры после каждого шага, а не один раз в конце" }
      - { id: b, text: "Резать задачи мельче, чтобы каждая проверялась одной командой" }
      - { id: c, text: "Писать промпты длиннее и с IMPORTANT, чтобы слабая модель не отвлекалась" }
      - { id: d, text: "Закрепить версии зависимостей и положить их документацию в репозиторий" }
    correct: [a, b, d]
    explanation: |
      Для слабой модели обвязка окупается: датчики, запущенные часто, ловят ошибку до того, как она
      разрастётся (Jain показал это на одной дешёвой модели через API; для open-weight моделей это
      экстраполяция). Мелкие задачи держат каждую проверку короткой. Без веб-поиска агент знает
      библиотеки только по обучению, поэтому закреплённые версии и локальная документация убирают
      устаревшие API. Длинный промпт с восклицательными знаками ничего не проверяет.
