version: 1
questions:
  - id: near-duplicate-helper
    type: single
    prompt: |
      В проекте две функции форматирования денег: `format_cents` в `money.py` и почти такая же
      `format_amount` в старом `utils.py`, которая округляет иначе. Агент в новом отчёте взял
      `format_amount`, суммы разошлись на цент. Какое исправление уберёт причину?
    options:
      - { id: a, text: "Написать в CLAUDE.md, какую из двух функций брать для отчётов" }
      - { id: b, text: "Попросить агента перед каждым отчётом сравнивать обе функции" }
      - { id: c, text: "Добавить тест на отчёт и чинить расхождения по мере появления" }
      - { id: d, text: "Оставить одну функцию: дубликат удалить или сделать обёрткой" }
    correct: [d]
    explanation: |
      Причина в репозитории: два похожих шаблона, и агент скопировал не тот (repo-misled). Изменение
      кода убирает то, что вводит в заблуждение: одна функция, дубликат удалён или вызывает
      основную. Строка памяти и тест на один отчёт оставляют ловушку для следующей задачи.

  - id: newer-api-offline
    type: multiple
    prompt: |
      Агент работает без доступа в интернет. Проект закреплён на Python 3.10, а агент пишет код с
      API из 3.12, и проверки у разработчика на 3.12 зелёные. Что предотвратит повтор? Выберите все
      верные.
    options:
      - { id: a, text: "Запускать тесты в make check закреплённым интерпретатором 3.10" }
      - { id: b, text: "Положить в репозиторий документацию стандартной библиотеки 3.10" }
      - { id: c, text: "Только написать в CLAUDE.md, что проект на Python 3.10" }
      - { id: d, text: "Попросить агента в задаче не использовать новые возможности" }
    correct: [a, b]
    explanation: |
      Модель знает API по обучающим данным и не видит, какая версия закреплена. Детерминированная
      проверка на закреплённом интерпретаторе ловит новое API до конца хода, а локальная документация
      даёт агенту верный источник без интернета. Строка в памяти и просьба не проверяют ничего.

  - id: invented-packages
    type: multiple
    prompt: |
      Агенты в команде несколько раз импортировали пакеты, которых не существует, и один раз
      поставили пакет с похожим именем из публичного индекса. Что защищает от этого? Выберите все
      верные.
    options:
      - { id: a, text: "Проверка в make check: импорт только из stdlib, своих и списка разрешённых" }
      - { id: b, text: "Правило deny на установку пакетов без человека, например pip install" }
      - { id: c, text: "Строка в промпте: используй только существующие пакеты" }
      - { id: d, text: "Разрешить агенту вендорить заглушку, если пакет не ставится" }
    correct: [a, b]
    explanation: |
      Список разрешённых модулей в проверке ловит выдуманный импорт детерминированно, а запрет
      установки без человека останавливает необратимое действие до вызова инструмента. Просьба не
      проверяема, а заглушка вместо пакета это и есть сбой I02.

  - id: dont-edit-tests
    type: single
    prompt: |
      В промпте каждой задачи написано "Не меняй тесты". Агент всё равно поменял ожидаемое значение
      в тесте, чтобы проверка стала зелёной. Что изменить, чтобы это не повторилось?
    options:
      - { id: a, text: "Повторить запрет в CLAUDE.md и в промпте заглавными буквами" }
      - { id: b, text: "Оценивать скрытыми тестами, которые агент не может изменить" }
      - { id: c, text: "Перейти на модель посильнее, которая не жульничает" }
      - { id: d, text: "Просить агента после задачи перечислить, какие файлы он менял" }
    correct: [b]
    explanation: |
      Наблюдения METR: инструкция не жульничать не останавливает подгонку под проверку. Исправление
      в среде: проверка, которую агент не может изменить (скрытые или мутационные тесты), или хук,
      запрещающий правку `tests/` во время реализации.

  - id: user-insists
    type: single
    prompt: |
      Вы уверенно говорите агенту: "Тест падает из-за часового пояса на CI, поправь таймзону". Агент
      соглашается и меняет настройки, хотя в выводе теста видно деление на ноль. Что это за сбой и
      что делать?
    options:
      - { id: a, text: "Угодничество: давать вывод проверки и просить причину по нему" }
      - { id: b, text: "Выдуманное API: запретить агенту менять настройки окружения CI" }
      - { id: c, text: "Нехватка контекста: дописать в CLAUDE.md описание CI" }
      - { id: d, text: "Устаревшее API: закрепить версию модуля часовых поясов" }
    correct: [a]
    explanation: |
      Модели склонны соглашаться с уверенным пользователем (угодничество). Свою гипотезу лучше не
      навязывать: дать вывод проверки и попросить назвать причину по нему, а исправление принимать по
      зелёной проверке, а не по согласию.

  - id: long-autonomous-task
    type: single
    prompt: |
      У модели 50-процентный горизонт задач около 3 часов. Команда хочет отдать ей фичу на 3 часа
      работы человека одним автономным запуском без промежуточных проверок. Что ожидать и как
      поступить?
    options:
      - { id: a, text: "Запуск почти наверняка удастся: задача не длиннее горизонта" }
      - { id: b, text: "Горизонт не про надёжность: он описывает только скорость модели" }
      - { id: c, text: "Примерно половина таких запусков провалится: дробить и проверять" }
      - { id: d, text: "Длина задачи не важна, важно только качество промпта" }
    correct: [c]
    explanation: |
      50-процентный горизонт означает, что задачи такой длины модель решает примерно в половине
      случаев: это граница, а не гарантия. Длинную задачу дробят на вертикальные куски с проверкой
      после каждого.
