# Reserve pool for the mentor review after failure-analysis-quiz is closed (design #42 2.5, as 00 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: failure-analysis-quiz
passBar: "passScore 0.8: at least 5 of 6 correct, exact set match per question"
questions:
  - id: distractor-file
    type: single
    prompt: |
      В корне репозитория лежит `notes-2023.md` со старым описанием API. Агент следует ему и
      вызывает функции, которые давно переименованы. Что сделать?
    options:
      - { id: a, text: "Удалить устаревший файл или перенести его в архив вне репозитория" }
      - { id: b, text: "Написать в CLAUDE.md, что notes-2023.md устарел и читать его не нужно" }
      - { id: c, text: "Попросить агента проверять даты файлов перед чтением" }
      - { id: d, text: "Добавить в notes-2023.md пометку IMPORTANT: устарело" }
    correct: [a]
    explanation: |
      Отвлекающий устаревший текст в репозитории вводит в заблуждение (repo-misled); надёжнее всего
      убрать его, а не просить агента его игнорировать.
  - id: stale-memory-line
    type: single
    prompt: |
      CLAUDE.md называет команду `make lint`, которой больше нет, и агент 30 ходов её восстанавливает.
      Какой класс причины?
    options:
      - { id: a, text: "invented-api: агент выдумал цель Makefile, которой никогда не было" }
      - { id: b, text: "gamed-check: агент подменил проверку своей" }
      - { id: c, text: "repo-misled: агент честно выполнил устаревшую строку памяти" }
      - { id: d, text: "no-self-check: агент не запустил тесты" }
    correct: [c]
    explanation: |
      Цель существовала, агент её не выдумывал; он следовал устаревшей строке памяти, а такие строки
      агент исполняет честно.
  - id: ambiguous-requirement
    type: single
    prompt: |
      "Покажи активных клиентов", а в проекте нет определения "активный". Агент выбрал "есть счёт за
      30 дней", бизнес имел в виду "есть неоплаченный счёт". На какой ступени исправление?
    options:
      - { id: a, text: "memory: записать в CLAUDE.md все бизнес-термины проекта с определениями" }
      - { id: b, text: "task: задача должна определять термин, а агент спросить до кода" }
      - { id: c, text: "check: тест на отчёт по активным клиентам" }
      - { id: d, text: "hook: блокировать задачи с неопределёнными словами" }
    correct: [b]
    explanation: |
      Шаг 0: проблема в задаче, неоднозначное требование, которое агент угадал. Исправление в
      постановке задачи и в привычке спрашивать до кода.
  - id: gamed-special-case
    type: single
    prompt: |
      Агент чинил падающий тест и добавил в код `if invoice.id == 42: return 0`, где 42 это id из
      теста. Класс причины?
    options:
      - { id: a, text: "missing-fact: агент не знал правило расчёта" }
      - { id: b, text: "repo-misled: так сделано где-то ещё в коде" }
      - { id: c, text: "no-self-check: агент не запустил проверку" }
      - { id: d, text: "gamed-check: код подогнан под проверяемый вход" }
    correct: [d]
    explanation: |
      Особый случай под вход теста это подгонка под проверку, первый класс по порядку. Защита в
      среде: скрытые входы проверки.
  - id: horizon-meaning
    type: multiple
    prompt: |
      Что верно про 50-процентный горизонт задач модели? Выберите все верные.
    options:
      - { id: a, text: "Задачи такой длины модель решает примерно в половине случаев" }
      - { id: b, text: "Это не порог надёжности: для надёжной работы задачи короче" }
      - { id: c, text: "Это время, за которое модель отвечает на один запрос" }
      - { id: d, text: "Длинную задачу стоит дробить и проверять каждый кусок" }
    correct: [a, b, d]
    explanation: |
      Горизонт это граница 50% успеха, а не гарантия: работу дробят и проверяют по частям.
  - id: sycophancy-defence
    type: multiple
    prompt: |
      Как снизить риск, что агент согласится с вашей неверной гипотезой о причине бага? Выберите все
      верные.
    options:
      - { id: a, text: "Дать вывод падающей проверки и попросить причину по нему" }
      - { id: b, text: "Сформулировать гипотезу как можно увереннее" }
      - { id: c, text: "Принимать исправление по зелёной проверке, а не по согласию" }
      - { id: d, text: "Запретить агенту возражать пользователю" }
    correct: [a, c]
    explanation: |
      Угодничество усиливается уверенной подачей. Помогает свидетельство (вывод проверки) и решение
      по проверке, а не по словам агента.
