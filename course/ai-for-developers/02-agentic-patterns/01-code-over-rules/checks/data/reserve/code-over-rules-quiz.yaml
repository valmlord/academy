# Reserve pool for the mentor review after code-over-rules-quiz is closed (design #42 2.5, as 00 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: code-over-rules-quiz
passBar: "passScore 0.8: at least 5 of 6 correct, exact set match per question"
questions:
  - id: test-command-line
    type: single
    prompt: |
      В CLAUDE.md есть строка "Run the whole check with `make check`". Цель `check` в Makefile есть,
      хуков в проекте нет. Где эта строка остановится на лестнице размещения?
    options:
      - { id: a, text: "check: команда уже существует в Makefile, значит, гарантия живёт там" }
      - { id: b, text: "memory: это команда проверки всего проекта, первый шаг лестницы" }
      - { id: c, text: "delete: агент сам найдёт цель check, если откроет Makefile" }
      - { id: d, text: "hook: агента нужно заставить запускать проверку в конце хода" }
    correct: [b]
    explanation: |
      Шаг 1 спрашивает раньше всех: строка с командой сборки, тестов или проверки всего проекта
      остаётся в памяти. Это самая полезная строка файла памяти: она экономит агенту поиск и угадывание.

  - id: dead-module-copied
    type: single
    prompt: |
      В репозитории лежит модуль `legacy_db.py`, который никто не импортирует, со своей работой с
      базой. Агент дважды скопировал из него приём. В CLAUDE.md решают написать "не копируй
      legacy_db.py". Что сильнее?
    options:
      - { id: a, text: "Строка в CLAUDE.md, но с IMPORTANT и восклицательными знаками" }
      - { id: b, text: "Хук, который блокирует чтение legacy_db.py инструментом Read" }
      - { id: c, text: "Удалить модуль: импортёров нет, и копировать станет нечего" }
      - { id: d, text: "Переименовать модуль в do_not_copy.py, чтобы имя предупреждало" }
    correct: [c]
    explanation: |
      Шаг 4: изменение кода убирает то, что вводит в заблуждение. Агенты копируют существующие
      шаблоны; мёртвый модуль без импортёров удаляют, и правило памяти становится не нужно. История
      остаётся в git.

  - id: contract-blocks-code-step
    type: single
    prompt: |
      Правило: "не используй `vendor_api.parse` в новом коде". Docstring модуля говорит, что внешний
      партнёр импортирует `vendor_api.parse` по контракту до конца года, менять модуль нельзя.
      Проверки импорта в репозитории нет. Где правило остановится?
    options:
      - { id: a, text: "check: детерминированная проверка импортов найдёт нарушение позже" }
      - { id: b, text: "code: удалить vendor_api.parse, раз новое использование вредно" }
      - { id: c, text: "delete: агент прочитает docstring и сам не станет использовать" }
      - { id: d, text: "hook: блокировать каждую правку, где появляется vendor_api" }
    correct: [a]
    explanation: |
      Шаг 4 даёт "нет": удаление нарушило бы задокументированный контракт. Шаг 5 тоже "нет": импорт,
      найденный после хода, стоит одной правки. Шаг 6 даёт "да": проверка импортов по AST.

  - id: guide-or-sensor
    type: single
    prompt: |
      Команда настроила для агента три вещи: CLAUDE.md с описанием архитектуры, PreToolUse-хук,
      который блокирует правку сгенерированных файлов, и линтер импортов в `make check`. Что из этого
      направляет агента до действия, а не проверяет результат?
    options:
      - { id: a, text: "Линтер импортов: он подсказывает агенту исправление в сообщении" }
      - { id: b, text: "PreToolUse-хук: он срабатывает до вызова инструмента правки" }
      - { id: c, text: "Все три: каждый из них влияет на следующий шаг агента в сессии" }
      - { id: d, text: "CLAUDE.md: текст в контексте, который агент читает до работы" }
    correct: [d]
    explanation: |
      Файл памяти это guide: он влияет на решение заранее и ничего не проверяет. Хук и линтер
      детерминированно реагируют на действие или результат: это вычислительный контроль.

  - id: when-memory-line-is-ok
    type: multiple
    prompt: |
      Когда строка в CLAUDE.md, а не код, хук или проверка, это разумное решение? Выберите все верные.
    options:
      - { id: a, text: "Это первая реакция на новую ошибку, пока не ясно, повторится ли она" }
      - { id: b, text: "Это факт, которого нет в репозитории, например договорённость с отделом" }
      - { id: c, text: "Нарушение необратимо, и его нужно остановить до вызова инструмента" }
      - { id: d, text: "Это обязательное правило, а проверку для него писать долго" }
    correct: [a, b]
    explanation: |
      Строка памяти законна как первый шаг (Hashimoto: сначала строка, повтор повышает правило в код
      или проверку) и для фактов, которых репозиторий не показывает. Необратимое нарушение требует хука,
      а обязательное правило, которое программа может проверить, место проверки.

  - id: bloat-costs
    type: multiple
    prompt: |
      В CLAUDE.md 40 строк, из них 30 повторяют то, что видно в коде и Makefile. Что верно про эти 30
      строк? Выберите все верные.
    options:
      - { id: a, text: "Они занимают контекст в каждой сессии, даже когда задача о другом" }
      - { id: b, text: "Они устаревают при изменении кода, и агент следует устаревшему тексту" }
      - { id: c, text: "Они безвредны: агент всё равно перепроверяет каждую строку по коду" }
      - { id: d, text: "Их можно удалить: агент читает репозиторий сам и увидит то же" }
    correct: [a, b, d]
    explanation: |
      Выводимое из репозитория удаляют: агент видит его сам, а строка стоит контекста и устаревает.
      Агент не перепроверяет каждую строку памяти: неверное правило он честно исполняет.
