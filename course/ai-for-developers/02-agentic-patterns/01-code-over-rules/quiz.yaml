version: 1
questions:
  - id: place-a-new-rule
    type: single
    prompt: |
      В CLAUDE.md проекта `invoice-service` коллега добавил строку: "Never call `repository.connect()`
      without closing the connection". В репозитории нет хука или проверки, которые знают об этом.
      Функция `connect()` сейчас возвращает голое соединение `sqlite3`. Пройдите строку по лестнице:
      где она остановится?
    options:
      - { id: a, text: "memory: это правило работы с базой, агенту нужно о нём помнить" }
      - { id: b, text: "code: connect() можно сделать контекстным менеджером, который сам закроет" }
      - { id: c, text: "hook: агента нужно остановить до вызова инструмента, который пишет код с базой" }
      - { id: d, text: "delete: агент сам видит в коде, как в проекте закрывают соединения" }
    correct: [b]
    explanation: |
      Шаги 1-3 дают "нет": это не команда проверки проекта, ни хук, ни проверка её не обеспечивают, а
      агент, проигнорировав строку, оставит соединение открытым. Шаг 4 даёт "да": изменение кода делает
      ошибку невозможной в обычном использовании. Например, `connect()` становится своим контекстным
      менеджером (через `contextlib.contextmanager` или `contextlib.closing`), который закрывает
      соединение при выходе. Собственный `with` у `sqlite3.Connection` только фиксирует или откатывает
      транзакцию и соединение не закрывает, поэтому одного `with repository.connect()` мало. До хука
      лестница не доходит.

  - id: demote-a-style-hook
    type: single
    prompt: |
      В проекте есть PreToolUse-хук, который отклоняет любую правку, где функция длиннее 30 строк.
      Агент тратит ходы на обход хука, а ревьюеры иногда сами просят длинную функцию, потому что так
      понятнее. Что разумно сделать по лестнице размещения?
    options:
      - { id: a, text: "Ужесточить хук до 20 строк, чтобы агент сразу писал короче" }
      - { id: b, text: "Оставить хук и продублировать правило восклицательными знаками в CLAUDE.md" }
      - { id: c, text: "Перенести правило в Stop-хук, чтобы проверка шла только в конце хода" }
      - { id: d, text: "Понизить: это предпочтение с законными исключениями, хук и строку удалить" }
    correct: [d]
    explanation: |
      Шаг 3: предпочтение с законными исключениями агент может нарушать без вреда, ему место на ступени
      `delete`. Хук ради предпочтения стоит ходов и мешает законным исключениям. Лестница работает в обе
      стороны: правило поднимают в код или хук, когда без этого случается вред, и опускают, когда вред
      не случается.

  - id: computational-sensors
    type: multiple
    prompt: |
      Какие из этих средств контроля вычислительные сенсоры, то есть детерминированная программа
      проверяет результат работы агента после факта? Выберите все верные.
    options:
      - { id: a, text: "Тест, который падает, если `ledger` импортирует модуль из `invoices`" }
      - { id: b, text: "Строка CLAUDE.md: \"ledger must never import from invoices\"" }
      - { id: c, text: "Линтер по AST, который печатает нарушение и способ исправления" }
      - { id: d, text: "Ревью диффа второй моделью с вопросом \"нарушена ли архитектура\"" }
    correct: [a, c]
    explanation: |
      Тест и линтер детерминированы и смотрят на результат: это вычислительные сенсоры. Строка в
      CLAUDE.md направляет агента до действия (guide), а не проверяет результат. Ревью второй моделью
      тоже сенсор, но инферентный: его вердикт не детерминирован.

  - id: swapped-argument
    type: single
    prompt: |
      Агент в третий раз вызвал `late_fee(days_late, balance)` вместо `late_fee(balance, days_late)`.
      Оба аргумента целые числа, тесты зелёные. Что надёжнее всего предотвратит повтор у этого агента и
      у следующего?
    options:
      - { id: a, text: "Сделать параметры только именованными, чтобы вызов без имён упал" }
      - { id: b, text: "Добавить в CLAUDE.md строку IMPORTANT о порядке аргументов late_fee" }
      - { id: c, text: "Попросить агента в начале каждой сессии перечитать сигнатуру late_fee" }
      - { id: d, text: "Переставить параметры местами, чтобы порядок совпал с привычкой агента" }
    correct: [a]
    explanation: |
      Это poka-yoke: изменение кода делает ошибку невозможной. С параметрами `*, amount_cents,
      days_late` позиционный вызов поднимает `TypeError`, а именованный читается и проверяется глазами.
      Строка памяти и напоминание остаются просьбой, которую можно не выполнить, а перестановка
      параметров только меняет, какую ошибку агент сделает следующей.

  - id: map-style-agents-md
    type: multiple
    prompt: |
      Команда сравнивает два варианта инструкций для агента: AGENTS.md на 600 строк со всеми правилами
      проекта и AGENTS.md примерно на 100 строк, который служит картой и ссылается на документы в
      `docs/`. Чем плох первый вариант? Выберите все верные.
    options:
      - { id: a, text: "Он грузится в каждую сессию и вытесняет из контекста саму задачу" }
      - { id: b, text: "Он устаревает: правки кода не обновляют прозу, а агент ей следует" }
      - { id: c, text: "Его нельзя проверить программой, в отличие от теста или линтера" }
      - { id: d, text: "Агенты не читают файлы инструкций длиннее 200 строк, они их пропускают" }
    correct: [a, b, c]
    explanation: |
      Большой файл памяти занимает контекст в каждой сессии, устаревает вместе с кодом (агент честно
      следует устаревшему правилу) и не проверяется ничем, кроме чтения. Утверждение про 200 строк
      неверно: длинный файл загружается, проблема в том, что он вытесняет и устаревает. Отсюда подход
      "карта плюс `docs/`" и перенос обязательных правил в код и проверки.

  - id: typed-boundary
    type: single
    prompt: |
      Функция принимает параметр `status: str`, и агент время от времени передаёт `"sent"`, хотя в
      системе такого статуса нет. Вы меняете тип параметра на перечисление `InvoiceStatus`. Что это
      даёт агенту?
    options:
      - { id: a, text: "Агент сам перестанет ошибаться, потому что модели лучше понимают enum" }
      - { id: b, text: "Ничего: тип в Python не проверяется, и поведение остаётся тем же" }
      - { id: c, text: "Ошибку видно на границе: неверное значение нельзя передать незамеченным" }
      - { id: d, text: "Строку в CLAUDE.md про допустимые статусы теперь можно не обновлять" }
    correct: [c]
    explanation: |
      Аннотация сама по себе во время выполнения ничего не проверяет. Граница даёт ошибку в двух местах:
      проверка типов (mypy и подобные) видит вызов со строкой `"sent"` там, где ждут `InvoiceStatus`, а
      код, который строит значение, пишет `InvoiceStatus("sent")` и получает `ValueError` сразу, а не
      где-то дальше в данных. Агент получает быстрый детерминированный сигнал. Вариант "ничего" верен
      только наполовину: интерпретатор аннотаций не проверяет, но проверка типов и создание перечисления
      проверяют. Модель от этого не становится умнее.
