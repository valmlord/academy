# Reserve pool for the mentor review after mcp-quiz is closed (design 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: mcp-quiz
passBar: "passScore 0.8: at least 5 of 6 correct, exact set match per question"
questions:
  - id: who-runs-the-command
    type: single
    prompt: |
      Агент "сам" запустил `pytest` и пересказал вам результат. Кто на самом деле исполнил команду
      и откуда модель узнала её вывод?
    options:
      - { id: a, text: "Исполнил харнесс, вывод он положил в контекст следующего хода" }
      - { id: b, text: "Исполнила модель на серверах вендора и прочитала вывод сама" }
      - { id: c, text: "Исполнила модель, а харнесс только показал вывод пользователю" }
      - { id: d, text: "Исполнил MCP-сервер, он же отправил вывод модели напрямую" }
    correct: [a]
    explanation: |
      Модель выдаёт только вызов инструмента. Харнесс проверяет разрешение, исполняет команду на
      машине и добавляет результат в список сообщений, который уходит в следующий запрос.

  - id: tool-definitions-cost
    type: single
    prompt: |
      В сессии подключено пять MCP-серверов с сотней инструментов, хотя задача трогает только git.
      Почему это стоит токенов даже на ходах, где ни один из этих инструментов не вызывается?
    options:
      - { id: a, text: "Каждый сервер берёт плату за подключение, отдельную от цены модели" }
      - { id: b, text: "Определения инструментов лежат в контексте и уходят с каждым ходом" }
      - { id: c, text: "Модель вызывает все инструменты по очереди, чтобы выбрать нужный" }
      - { id: d, text: "Сервер присылает свой лог в контекст после каждого ответа модели" }
    correct: [b]
    explanation: |
      Определения инструментов - часть контекста, а контекст отправляется заново на каждом ходе.
      Поэтому лишние инструменты стоят токенов всегда; CLI, который агент уже знает (`gh`), часто
      дешевле по контексту, чем MCP-сервер.

  - id: subagent-returns
    type: single
    prompt: |
      Родительский агент отдал субагенту задачу "найди, где считается налог". Субагент прочитал
      сорок файлов. Что попадает в контекст родителя?
    options:
      - { id: a, text: "Все сорок файлов целиком, ведь они нужны для ответа на вопрос" }
      - { id: b, text: "Все вызовы инструментов субагента вместе с их результатами" }
      - { id: c, text: "Только итоговая сводка, которую вернул субагент родителю" }
      - { id: d, text: "Ничего: результат субагента виден только пользователю в UI" }
    correct: [c]
    explanation: |
      Субагент - отдельный цикл со своим контекстом. Его чтения и вызовы остаются в его контексте,
      а родителю возвращается только итоговый результат.

  - id: denied-tool-result
    type: single
    prompt: |
      Харнесс получил от модели вызов `delete_branch`, а правило разрешений его запрещает. Что
      правильный харнесс делает дальше?
    options:
      - { id: a, text: "Исполняет вызов и только потом сообщает модели о нарушении правила" }
      - { id: b, text: "Аварийно завершает сессию, чтобы модель не попробовала ещё раз" }
      - { id: c, text: "Молча пропускает вызов и ждёт от модели следующего хода без ответа" }
      - { id: d, text: "Не исполняет вызов и возвращает модели результат с отказом" }
    correct: [d]
    explanation: |
      Проверка разрешения идёт до исполнения. Запрещённый вызов не исполняется, а модель получает
      результат-отказ, чтобы выбрать другой путь; цикл продолжается.

  - id: tool-server-traffic
    type: multiple
    prompt: |
      Вы пишете клиент к локальному MCP-образному серверу, который говорит JSON-RPC 2.0 через
      stdio. Что из этого относится к вашему клиенту? Выберите все верные.
    options:
      - { id: a, text: "Запустить сервер дочерним процессом и писать запросы в его stdin" }
      - { id: b, text: "Узнать инструменты сервера запросом `tools/list`, а не хардкодом" }
      - { id: c, text: "Передать модели stdin сервера, чтобы она писала в него сама" }
      - { id: d, text: "Вызывать инструмент запросом `tools/call` с именем и аргументами" }
    correct: [a, b, d]
    explanation: |
      Клиент (в харнессе) запускает сервер, находит его инструменты через `tools/list` и
      вызывает через `tools/call`. Модель к серверу доступа не получает: она выдаёт только ход.

  - id: workflow-vs-agent
    type: multiple
    prompt: |
      Команда решает, делать ли обработку заявок жёстким workflow или агентом. Какие утверждения
      верны по статье "Building effective agents" (2024)? Выберите все верные.
    options:
      - { id: a, text: "Workflow ведёт модель по заранее заданному в коде пути" }
      - { id: b, text: "Агент сам выбирает инструменты в цикле, получая обратную связь" }
      - { id: c, text: "Агент всегда надёжнее workflow, поэтому его стоит брать сразу" }
      - { id: d, text: "Если путь задачи известен заранее, обычно хватает workflow" }
    correct: [a, b, d]
    explanation: |
      В статье workflow - заранее заданные пути в коде, агент - модель, которая сама направляет
      использование инструментов в цикле с обратной связью от среды. Рекомендация - начинать с
      самого простого решения и усложнять только при необходимости.
