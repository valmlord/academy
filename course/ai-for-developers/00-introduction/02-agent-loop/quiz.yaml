version: 1
questions:
  - id: mcp-roles
    type: single
    prompt: |
      Вы работаете в Claude Code. Он подключён к MCP-серверу `github-tools`, который запущен
      локальным процессом и отдаёт инструменты для работы с задачами. Кто здесь кто по ролям MCP?
    options:
      - { id: a, text: "Claude Code - сервер, `github-tools` - клиент, модель - хост" }
      - { id: b, text: "Модель - клиент, `github-tools` - сервер, Claude Code - хост" }
      - { id: c, text: "Claude Code - хост с клиентом внутри, `github-tools` - сервер" }
      - { id: d, text: "`github-tools` - хост, Claude Code - клиент, у модели роли нет" }
    correct: [c]
    explanation: |
      Хост - приложение, в котором работает пользователь (здесь Claude Code); внутри хоста для
      каждого сервера живёт MCP-клиент, который держит соединение. `github-tools` - сервер: он
      отдаёт инструменты. Модель в протоколе не участвует: она только выдаёт вызов инструмента,
      а соединение держит харнесс.

  - id: harness-after-tool-call
    type: multiple
    prompt: |
      Модель в ответе выдала вызов инструмента `create_issue` MCP-сервера. Что из этого делает
      харнесс? Выберите все верные.
    options:
      - { id: a, text: "Проверяет, разрешён ли этот вызов, до того как его исполнить" }
      - { id: b, text: "Отправляет вызов серверу через `tools/call` и ждёт ответа" }
      - { id: c, text: "Передаёт модели адрес сервера, чтобы она сама подключилась к нему" }
      - { id: d, text: "Кладёт результат вызова в контекст для следующего хода модели" }
    correct: [a, b, d]
    explanation: |
      Модель только выбирает инструмент и аргументы. Харнесс проверяет разрешение, исполняет
      вызов (для MCP - через клиента и `tools/call`) и возвращает результат в контекст. Модель
      ни к чему не подключается: у неё нет соединений, есть только текст на входе и выходе.

  - id: transport-choice
    type: single
    prompt: |
      Нужно подключить два MCP-сервера: линтер, который запускается на вашей машине как дочерний
      процесс, и сервис компании, который работает на удалённом хосте. Какие транспорты
      спецификация MCP предусматривает для этих двух случаев?
    options:
      - { id: a, text: "Линтеру stdio, удалённому сервису Streamable HTTP" }
      - { id: b, text: "Обоим stdio: так быстрее, сеть добавит задержку" }
      - { id: c, text: "Линтеру Streamable HTTP, удалённому сервису stdio" }
      - { id: d, text: "Обоим Streamable HTTP: один транспорт на всё" }
    correct: [a]
    explanation: |
      stdio - транспорт для локального сервера, который клиент запускает как дочерний процесс и
      говорит с ним через stdin/stdout. Streamable HTTP - транспорт для удалённого сервера по
      сети. Оба транспорта есть в спецификации.

  - id: local-server-risks
    type: multiple
    prompt: |
      Коллега предлагает поставить локальный MCP-сервер из незнакомого репозитория: "это просто
      набор инструментов". Какие риски реальны? Выберите все верные.
    options:
      - { id: a, text: "Сервер выполняет любой код с правами процесса клиента на вашей машине" }
      - { id: b, text: "Описания его инструментов могут содержать инструкции, которым верить нельзя" }
      - { id: c, text: "Сервер видит всю переписку сессии, даже если его не вызывали" }
      - { id: d, text: "Сервер ничем не может навредить, пока модель не вызвала ни одного инструмента" }
    correct: [a, b]
    explanation: |
      Локальный MCP-сервер - это программа, запущенная с правами клиента: она может делать что
      угодно уже при запуске, без единого вызова. Описания инструментов попадают в контекст
      модели и являются недоверенным вводом. Переписку сессии сервер сам не видит: он получает
      только аргументы вызовов своих инструментов.

  - id: checkpoint-remote-effect
    type: single
    prompt: |
      Агент в Claude Code отредактировал два файла и выполнил команду, которая отправила сообщение
      в рабочий чат. Вы откатываетесь на чекпоинт до этих действий. Что произойдёт?
    options:
      - { id: a, text: "Откатятся и правки файлов, и сообщение в чате удалится" }
      - { id: b, text: "Откатятся правки файлов, а сообщение в чате останется" }
      - { id: c, text: "Откатятся только правки, сделанные до этой команды" }
      - { id: d, text: "Откатится только сообщение, правки нужно отменять в git" }
    correct: [b]
    explanation: |
      Чекпоинты в Claude Code покрывают правки файлов, но не внешние побочные эффекты: отправленное
      сообщение, деплой, запись в удалённую базу. Такие действия откатывать нечем, поэтому их и
      ставят под проверку разрешений.
