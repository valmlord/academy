# Reserve pool for the mentor review after cost-quiz is closed (design 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: cost-quiz
passBar: "passScore 0.8: at least 5 of 6 correct, exact set match per question"
questions:
  - id: largest-component-short-session
    type: single
    prompt: |
      Короткая сессия: 5 ходов, контекст маленький, но модель на каждом ходе пишет по 3 000 токенов
      кода. Цена выхода в 5 раз выше цены входа. Какая составляющая, скорее всего, главная?
    options:
      - { id: a, text: "Выход: токенов меньше, но каждый в 5 раз дороже входа" }
      - { id: b, text: "Чтение из кэша: его всегда больше всего в любой сессии" }
      - { id: c, text: "Некэшированный вход: первый ход всегда самый дорогой" }
      - { id: d, text: "Определить нельзя, пока сессия не стала длиннее" }
    correct: [a]
    explanation: |
      В короткой сессии контекст ещё мал, а выход крупный и самый дорогой за токен. Главную
      составляющую считают в долларах, а не в токенах.

  - id: cache-miss-component
    type: single
    prompt: |
      В логе после паузы в 40 минут у хода `cache_read_input_tokens` равен 0, а `input_tokens`
      подскочил до 90 000. Какая составляющая выросла у этого хода?
    options:
      - { id: a, text: "Выход: после паузы модель отвечает длиннее обычного" }
      - { id: b, text: "Некэшированный вход: префикс оплачен по полной цене" }
      - { id: c, text: "Чтение из кэша: кэш перечитывался после паузы заново" }
      - { id: d, text: "Ни одна: пауза сама по себе тарифицируется отдельно" }
    correct: [b]
    explanation: |
      Кэш истёк, поэтому весь префикс пришёл как некэшированный вход по полной цене входа. Пауза -
      причина, а выросшая составляющая - некэшированный вход.

  - id: batch-for-agent
    type: single
    prompt: |
      Коллега хочет сэкономить 50% на интерактивном агенте в IDE, переведя его на Batch API.
      Что не так с этим планом?
    options:
      - { id: a, text: "Batch дороже обычных запросов, скидки у него нет" }
      - { id: b, text: "Batch не поддерживает модели старше Haiku-класса" }
      - { id: c, text: "Batch отвечает асинхронно, агенту ответ нужен сразу" }
      - { id: d, text: "Batch нельзя использовать для запросов с кодом" }
    correct: [c]
    explanation: |
      Batch API даёт 50% скидки, но обрабатывает запросы асинхронно. Интерактивному агенту нужен
      ответ на каждом ходе сразу, поэтому этот рычаг ему не подходит.

  - id: cheaper-model-more-turns
    type: single
    prompt: |
      На модели B (в 5 раз дешевле за токен) задача заняла в 4 раза больше ходов, и средний ход
      нёс контекст вдвое длиннее, чем на модели A. Что можно сказать про входные токены на задачу?
    options:
      - { id: a, text: "Их столько же: число ходов на вход не влияет" }
      - { id: b, text: "Их вдвое больше, значит B всё равно дешевле" }
      - { id: c, text: "Их в 4 раза больше, значит цены совпадут" }
      - { id: d, text: "Их в 8 раз больше, значит по входу B дороже" }
    correct: [d]
    explanation: |
      Вход задачи = число ходов x средний контекст хода: 4 x 2 = 8 раз больше токенов. При цене в
      5 раз ниже вход на B обходится в 8 / 5 = 1.6 раза дороже.

  - id: what-does-not-cost
    type: multiple
    prompt: |
      Вы разбираете счёт за сессию агента. За что из этого вы действительно заплатили? Выберите
      все верные.
    options:
      - { id: a, text: "Определения инструментов, которые уходили в каждом запросе" }
      - { id: b, text: "Файлы, которые агент прочитал и которые остались в истории" }
      - { id: c, text: "Тысячи файлов репозитория, которые агент так и не открыл" }
      - { id: d, text: "Ответы модели, включая её вызовы инструментов как вывод" }
    correct: [a, b, d]
    explanation: |
      Платят только за то, что попало в запросы и ответы: определения инструментов, прочитанные
      файлы в истории, вывод модели. Файлы на диске, которые агент не открывал, ничего не стоят.

  - id: idle-gap-levers
    type: multiple
    prompt: |
      Вы часто уходите на обед посреди задачи, и после возвращения первый ход стоит в разы дороже.
      Какие действия уменьшают эту составляющую? Выберите все верные.
    options:
      - { id: a, text: "Не оставлять задачу в простое посреди работы над ней" }
      - { id: b, text: "После перерыва начать новую сессию с коротким контекстом" }
      - { id: c, text: "Попросить модель отвечать длиннее после перерыва" }
      - { id: d, text: "Подключить ещё один MCP-сервер, чтобы ускорить первый ход" }
    correct: [a, b]
    explanation: |
      Дорогой ход после паузы - некэшированный вход из-за промаха кэша. Помогает не делать пауз
      посреди задачи или начать заново с коротким контекстом, чтобы по полной цене шло меньше
      токенов. Длинные ответы и лишние инструменты только добавляют токенов.
