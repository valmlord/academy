version: 1
questions:
  - id: what-makes-turn-n-expensive
    type: multiple
    prompt: |
      Идёт длинная сессия агента. Что из этого делает очередной, N-й ход дороже? Выберите все
      верные.
    options:
      - { id: a, text: "Длина накопленного контекста, который этот ход отправляет заново" }
      - { id: b, text: "Пауза перед ходом дольше времени жизни кэша, вход идёт по полной цене" }
      - { id: c, text: "Большие файлы в репозитории, которые агент ни разу не открывал" }
      - { id: d, text: "Длинный ответ модели на этом ходе: выход дороже входа за токен" }
    correct: [a, b, d]
    explanation: |
      Каждый ход заново несёт весь контекст, поэтому вход растёт с длиной сессии. После паузы
      дольше жизни кэша префикс оплачивается как некэшированный вход. Выход - самая дорогая часть
      за токен. Файлы на диске ничего не стоят, пока не попали в запрос.

  - id: levers-for-scenario
    type: multiple
    prompt: |
      Сессия с утра решала три разные задачи подряд, не очищаясь. Агент на каждом шаге пишет
      длинные объяснения, которые вы не читаете. Какие рычаги здесь подходят? Выберите все верные.
    options:
      - { id: a, text: "Снизить effort и попросить короткие ответы без объяснений" }
      - { id: b, text: "Перевести эту интерактивную сессию на Batch API со скидкой" }
      - { id: c, text: "Начинать каждую новую задачу с `/clear` или новой сессии" }
      - { id: d, text: "Просить повторять прежние объяснения: пойдут по цене кэша" }
    correct: [a, c]
    explanation: |
      Длинные ответы бьют по выходу: помогают меньший effort и короткие ответы. Контекст прошлых
      задач едет в каждом ходе: помогает `/clear` или новая сессия между задачами. Batch API не
      подходит интерактивному агенту (ответ асинхронный). Кэш удешевляет только повторно
      отправляемый вход, а объяснения - это новый выход, он всегда идёт по полной цене выхода.

  - id: fan-out-subagents
    type: single
    prompt: |
      Родительский агент раздал пяти субагентам задачу "разберись в репозитории и найди место
      для фичи", каждому свою часть, но все начинают с обзора всего репозитория. Что с тратами?
    options:
      - { id: a, text: "Траты как у одного агента: субагенты делят один общий кэш" }
      - { id: b, text: "Траты меньше: каждый субагент видит только свою часть кода" }
      - { id: c, text: "Обзор репозитория оплачен пять раз: у каждого свой контекст" }
      - { id: d, text: "Траты не меняются: родитель платит только за итоговые сводки" }
    correct: [c]
    explanation: |
      Субагент - отдельный цикл со своим контекстом. Пять субагентов, каждый из которых читает
      репозиторий, - это пять отдельных чтений и пять растущих контекстов. Родитель получает
      короткие сводки, но платят за всю работу каждого субагента.

  - id: shared-limits
    type: single
    prompt: |
      Коллега на тарифе Pro полдня работал в Claude Code, а потом упёрся в лимит, открыв обычный
      чат в браузере. Он уверен, что это ошибка: "в чате я сегодня ничего не делал". Почему так?
    options:
      - { id: a, text: "Лимиты подписки общие для чата, десктопа и Claude Code" }
      - { id: b, text: "Чат и Claude Code тарифицируются по API отдельно от тарифа" }
      - { id: c, text: "Claude Code тратит лимит чата, только если запущен из десктопа" }
      - { id: d, text: "Лимит сбрасывается только раз в месяц, в день оплаты тарифа" }
    correct: [a]
    explanation: |
      На 2026-10-27 лимиты подписки Claude скользящие (окно 5 часов плюс недельные) и общие для
      чата, десктопа и Claude Code. Длинная сессия в Claude Code тратит тот же лимит, что и чат.

  - id: plan-or-api
    type: single
    prompt: |
      Разработчик пользуется агентом редко: пара коротких сессий в неделю, без долгих марафонов.
      Он сомневается, брать ли подписку или платить по API. Как разумно решить?
    options:
      - { id: a, text: "Подписку: фиксированная цена защищает от неожиданного счёта" }
      - { id: b, text: "API: так не придётся думать о скользящих окнах лимитов" }
      - { id: c, text: "Подписку: Claude Code работает только с ней, по API нельзя" }
      - { id: d, text: "Оценить месячный расход по API и сравнить с ценой тарифа" }
    correct: [d]
    explanation: |
      Каждый из остальных вариантов опирается на один довод и не считает расход (а Claude Code
      работает и с API-ключом). Решает реальный профиль: ожидаемый расход по API за месяц против
      цены тарифа и вопрос, упрётесь ли вы в окна лимитов. При редком использовании расход по API
      может оказаться ниже цены тарифа, при ежедневной работе - наоборот.
