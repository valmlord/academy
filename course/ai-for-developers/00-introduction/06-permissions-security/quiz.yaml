version: 1
questions:
  - id: lethal-trifecta-fix
    type: single
    prompt: |
      Агент читает входящие письма поддержки (их пишет кто угодно), имеет доступ к базе клиентов и
      может отправлять HTTP-запросы на любые адреса. Что здесь единственное надёжное решение?
    options:
      - { id: a, text: "Добавить в системный промпт запрет пересылать данные наружу" }
      - { id: b, text: "Поставить фильтр, который ловит 95% атак prompt injection" }
      - { id: c, text: "Убрать одну из трёх частей: письма, базу или выход в сеть" }
      - { id: d, text: "Перейти на более сильную модель, её труднее обмануть" }
    correct: [c]
    explanation: |
      Это lethal trifecta (Willison, 2025): приватные данные, недоверенный контент и внешняя
      связь в одном агенте. Промпт и фильтры не гарантия: 95% защиты - это провал. Надёжно только
      не сочетать все три части.

  - id: git-push-bypasses
    type: multiple
    prompt: |
      В Claude Code 2.1.311 в deny стоит `Bash(git push *)`, других правил для git нет. Какие из
      этих команд правило не остановит? Выберите все верные.
    options:
      - { id: a, text: "`git push origin main`" }
      - { id: b, text: "`git -C . push origin main`" }
      - { id: c, text: "`git -c push.default=current push`" }
      - { id: d, text: "`sh -c 'git push origin main'`" }
    correct: [b, c, d]
    explanation: |
      Bash-правило сравнивает текст команды с шаблоном. `git -C ...` и `git -c ...` начинаются не
      с `git push`, а `sh -c` или скрипт запускают git по другому пути. Правило не граница
      безопасности: от пуша защищают защита ветки на удалённом репозитории, хук или песочница.

  - id: sandbox-not-covered
    type: multiple
    prompt: |
      В Claude Code включена песочница (sandbox). Какие действия она НЕ ограничивает? Выберите все
      верные.
    options:
      - { id: a, text: "Встроенные инструменты Read и Edit" }
      - { id: b, text: "Bash-команду, которая пишет вне рабочей папки" }
      - { id: c, text: "Загрузки из веба инструментом WebFetch" }
      - { id: d, text: "Инструменты подключённых MCP-серверов" }
    correct: [a, c, d]
    explanation: |
      Песочница ограничивает Bash-команды и их дочерние процессы: запись вне рабочей папки и
      временного каталога, сеть через прокси. Встроенные Read/Edit, WebFetch, MCP и хуки она не
      покрывает: для них работают правила разрешений.

  - id: bypass-in-project-settings
    type: single
    prompt: |
      Коллега положил `"defaultMode": "bypassPermissions"` в проектный `.claude/settings.json`,
      чтобы агент не задавал вопросов. Что произойдёт в Claude Code 2.1.311?
    options:
      - { id: a, text: "Настройку проигнорируют, сессия стартует в режиме Manual (default)" }
      - { id: b, text: "Сессия стартует в bypass: проектные настройки сильнее всех остальных" }
      - { id: c, text: "Сессия стартует в auto, как будто defaultMode вообще не задан" }
      - { id: d, text: "Claude Code откажется запускаться, пока строку не уберут" }
    correct: [a]
    explanation: |
      С v2.1.257 `bypassPermissions` из проектных и локальных настроек не действует, и сессия
      стартует в Manual (default). Bypass включается только флагом запуска или в пользовательских
      настройках, и только для контейнеров и VM. Строку стоит убрать: она вводит в заблуждение.

  - id: unpinned-mcp-package
    type: single
    prompt: |
      В конфиге MCP стоит локальный сервер, который запускается как `npx some-mcp-server` без
      версии. Сегодня он работает хорошо. В чём главный риск?
    options:
      - { id: a, text: "Никакого: сервер общается с агентом только через сам протокол" }
      - { id: b, text: "Только производительность: npx долго скачивает пакет" }
      - { id: c, text: "Модель узнает адрес реестра пакетов и начнёт качать сама" }
      - { id: d, text: "При запуске выполнится любая новая версия с вашими правами" }
    correct: [d]
    explanation: |
      Локальный MCP-сервер - это код, который запускается с правами клиента. Без закреплённой
      версии каждый запуск может принести новый код, который никто не проверял. Закрепляйте версию,
      смотрите, что ставите, ограничивайте окружение.

  - id: hook-crash-fails-open
    type: single
    prompt: |
      В проекте есть только PreToolUse-хук, который должен блокировать правки в `generated/`;
      deny-правила для `generated/` нет. Хук падает с exit 1 на очередном Edit в `generated/`.
      Что происходит в Claude Code 2.1.311 и что сделает поведение безопасным?
    options:
      - { id: a, text: "Правка блокируется: любой ненулевой код хука считается отказом" }
      - { id: b, text: "Правка проходит; блок дадут onFailure: \"block\" или deny" }
      - { id: c, text: "Claude Code останавливает сессию, пока хук не починят" }
      - { id: d, text: "Правка проходит; помогает только перезапуск сессии" }
    correct: [b]
    explanation: |
      Блокирует только exit 2 (или JSON deny). Exit 1, падение, таймаут или хук, который не
      стартовал, - это ошибка без блокировки: вызов идёт дальше (fail open). Закрыть отказ можно
      регистрацией с `"onFailure": "block"` или deny-правилом. В политике модуля deny-правило для
      `generated/` есть, поэтому там правка всё равно была бы заблокирована.
