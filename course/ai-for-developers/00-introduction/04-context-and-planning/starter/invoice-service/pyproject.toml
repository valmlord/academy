[project]
name = "invoice-service"
version = "0.4.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.4"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/invoices/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
pythonpath = ["src"]
