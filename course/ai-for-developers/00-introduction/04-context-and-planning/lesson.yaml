id: intro-context-planning
title: "Контекст-инжиниринг. Планирование и исполнение"
type: bug-hunt
outcomes:
  - "Находит в транскрипте сессии ошибки управления контекстом и до начала исполнения составляет план задачи с проверяемыми шагами."
estimatedMinutes: 70
status: ready
prerequisites:
  - intro-agent-loop
  - intro-cost-economics
workspace:
  image: academy-workspace:dev
  starter: starter
sources:
  - title: "Anthropic: Effective context engineering for AI agents (2025-09-29)"
    url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    checkedAt: "2026-10-27"
  - title: "Claude Code: Best practices (план, проверка, Esc, /clear после двух исправлений, что перестать делать)"
    url: https://code.claude.com/docs/en/best-practices
    checkedAt: "2026-10-27"
  - title: "Claude Code: How Claude Code works (компакция, Compact Instructions, /context, tool search, субагенты)"
    url: https://code.claude.com/docs/en/how-claude-code-works
    checkedAt: "2026-10-27"
checks:
  - id: context-bug-hunt
    title: "Ошибки управления контекстом в транскрипте сессии"
    kind: bug-hunt
    answers: checks/bugs.yaml
    minFound: 5
    weight: 2
  - id: plan-structure
    title: "Структура plan.md: разделы, шаги с проверкой, пути, вопросы"
    kind: command
    run: 'python3 -I "$ACADEMY_CHECKS_DIR/verify_plan.py"'
    timeoutSec: 30
    weight: 1
  - id: plan-rubric
    title: "Качество плана (оценка ментора по рубрике)"
    kind: rubric
    rubric: checks/rubric-plan.md
    artifacts:
      - plan.md
    passScore: 0.7
    weight: 2
