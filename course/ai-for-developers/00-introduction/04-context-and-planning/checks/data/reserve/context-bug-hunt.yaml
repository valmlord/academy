# Reserve item for the mentor review after context-bug-hunt is closed (design 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same matching rules as checks/bugs.yaml (design 2.2):
# a report matches when file, category and a line inside one of the bug's ranges agree.
version: 1
check: context-bug-hunt
report: findings-reserve.json
minFound: 3
maxReports: 4
maxDecoyHits: 1
passBar: "minFound 3 of 3 planted mistakes, at most 4 reports, at most 1 report on a decoy range"
file: transcript-2.md
