bugs:
  - id: whole-log-read
    file: transcript-2.md
    lines: [[7, 9]]
    category: bloat-tool-read
    title: "Весь лог на ~600k токенов прочитан целиком вместо grep/tail."
  - id: rewrite-without-check
    file: transcript-2.md
    lines: [[29, 31], [37, 37]]
    category: no-verification
    title: "Переписаны три модуля без проверки, 'готово' без запуска тестов."
  - id: main-rule-lost
    file: transcript-2.md
    lines: [[11, 11], [57, 58]]
    category: lost-instruction
    title: "Правило 'не коммитить в main' было только в чате вчерашней сессии; в новой сессии агент коммитит в main."
decoys:
  - id: grep-log-tail
    file: transcript-2.md
    lines: [[15, 17]]
    lookalike: bloat-tool-read
  - id: fix-with-test-output
    file: transcript-2.md
    lines: [[22, 24]]
    lookalike: no-verification
  - id: memory-read-new-session
    file: transcript-2.md
    lines: [[45, 47]]
    lookalike: lost-instruction
