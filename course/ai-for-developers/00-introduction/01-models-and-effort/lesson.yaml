    checkedAt: "2026-10-27"
  - title: "Anthropic: Effort (уровни, рекомендации по моделям)"
    url: https://platform.claude.com/docs/en/build-with-claude/effort
    checkedAt: "2026-10-27"
  - title: "Claude Code: Model configuration (/effort, ultrathink, effort по умолчанию)"
    url: https://code.claude.com/docs/en/model-config
    checkedAt: "2026-10-27"
  - title: "Claude Code: Best practices (ultrathink и think hard)"
    url: https://code.claude.com/docs/en/best-practices
    checkedAt: "2026-10-27"
  - title: "OpenAI Codex: Models (модели и уровни reasoning)"
