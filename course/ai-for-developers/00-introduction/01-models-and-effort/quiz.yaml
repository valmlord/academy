version: 1
questions:
  - id: effort-covers-tool-calls
    type: single
    prompt: |
      Агент на высоком уровне усилия (effort) делает 40 вызовов инструментов за задачу и работает
      заметно медленнее, чем на `low`. Что именно меняет уровень усилия в таком запуске?
    options:
      - { id: a, text: "Только длину скрытого рассуждения перед финальным ответом пользователю" }
      - { id: b, text: "Расход токенов на весь вывод модели, включая вызовы инструментов" }
      - { id: c, text: "Жёсткий лимит токенов на запрос, который модель не может превысить" }
      - { id: d, text: "Количество инструментов, которые харнесс разрешает модели вызвать" }
    correct: [b]
    explanation: |
      Effort - поведенческий сигнал, а не жёсткий бюджет токенов, и он действует на весь вывод
      модели: текст, рассуждение и вызовы инструментов (вызов инструмента - тоже вывод модели).
      Поэтому в агентном запуске с десятками вызовов разница в уровне усилия умножается.

  - id: check-the-surface
    type: single
    prompt: |
      Вы отлаживали промпт через API, потом перенесли тот же сценарий в CLI-агента на той же модели,
      и ответы стали заметно менее глубокими. Что разумно сделать первым?
    options:
      - { id: a, text: "Дописать в промпт просьбу думать тщательнее и повторить запуск" }
      - { id: b, text: "Перейти на модель уровнем выше, раз эта не справляется в CLI" }
      - { id: c, text: "Считать, что дефолт усилия везде один, и искать причину в промпте" }
      - { id: d, text: "Проверить, какое усилие реально выставлено в этой поверхности" }
    correct: [d]
    explanation: |
      Дефолты усилия могут отличаться между поверхностями одной модели (датированный пример из
      теории: Sonnet 5.5 по умолчанию high в API и medium в Claude Code). Привычка: назвать
      поверхность и проверить фактическую настройку (`/effort`, конфиг, документация этого
      инструмента), а не полагаться на дефолт, запомненный в другом месте.

  - id: ultrathink-vs-plain-text
    type: single
    prompt: |
      В Claude Code 2.1.311 вы пишете в одном сообщении "think hard about this", а в другом слово
      `ultrathink`. Чем различаются эти два сообщения для харнесса?
    options:
      - { id: a, text: "`ultrathink` углубляет рассуждение на один ход, think hard - текст" }
      - { id: b, text: "Оба выражения переключают уровень усилия до конца всей текущей сессии" }
      - { id: c, text: "think hard задаёт бюджет рассуждения, а `ultrathink` его снимает" }
      - { id: d, text: "Ничем: оба выражения - обычный текст, харнесс их не распознаёт" }
    correct: [a]
    explanation: |
      В Claude Code 2.1.311 `ultrathink` - ключевое слово, которое запрашивает более глубокое
      рассуждение на один ход. Фразы вроде "think hard" харнесс не распознаёт: модель видит их
      как обычный текст промпта. Это поведение конкретного инструмента и версии.

  - id: old-snippet-rejected
    type: single
    prompt: |
      Пример из блога двухлетней давности задаёт параметр рассуждения, который ваша текущая модель
      отвергает с ошибкой. Какой ход надёжнее всего?
    options:
      - { id: a, text: "Подобрать значение параметра, при котором ошибка пропадёт" }
      - { id: b, text: "Откатиться на модель того поколения, для которой писали пример" }
      - { id: c, text: "Открыть текущую документацию этой модели и взять способ оттуда" }
      - { id: d, text: "Заменить параметр похожим по названию из нового API" }
    correct: [c]
    explanation: |
      Способы управлять рассуждением меняются между поколениями моделей (датированный пример из
      теории: `budget_tokens` у новых моделей не принимается, вместо него effort). Сниппет
      описывает старую модель; источник истины - документация текущей модели.

  - id: local-small-context
    type: multiple
    prompt: |
      Локальная модель запущена с окном контекста 4096 токенов, и агент на ней постоянно ломает
      вызовы инструментов. Какие изменения могут помочь? Выберите все верные.
    options:
      - { id: a, text: "Увеличить окно контекста модели в настройках локального сервера" }
      - { id: b, text: "Взять локальную модель, которая обучена вызывать инструменты" }
      - { id: c, text: "Поднять уровень усилия, чтобы модель лучше запоминала инструменты" }
      - { id: d, text: "Сократить число подключённых инструментов и их описаний" }
    correct: [a, b, d]
    explanation: |
      Типичные поломки локального запуска: маленькое окно (определения инструментов, системный
      промпт и история просто не помещаются) и слабое умение модели вызывать инструменты. Помогают
      большее окно, модель с поддержкой инструментов и меньше определений в контексте. Уровень
      усилия не расширяет окно и не учит модель формату вызовов.

  - id: when-local-is-justified
    type: multiple
    prompt: |
      Команда спорит, переводить ли часть работы агента на локальную модель. Какие доводы
      действительно оправдывают локальный запуск? Выберите все верные.
    options:
      - { id: a, text: "Код или данные по договору не могут покидать машину разработчика" }
      - { id: b, text: "Локальная модель бесплатна, значит любая задача на ней выйдет дешевле" }
      - { id: c, text: "Работа идёт в закрытом контуре или офлайн, без доступа к облаку" }
      - { id: d, text: "Локальная модель того же размера даёт то же качество, что облачная" }
    correct: [a, c]
    explanation: |
      Локальный запуск оправдан приватностью, офлайном и закрытым контуром. "Бесплатно" -
      заблуждение: есть железо, электричество, время и больше ходов на слабой модели. Паритет
      качества с облачными моделями не доказан; теория его не утверждает.
