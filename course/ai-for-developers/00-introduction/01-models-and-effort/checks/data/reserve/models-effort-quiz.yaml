# Reserve pool for the mentor review after models-effort-quiz is closed (design 2.5.6).
# Mentor-review store, never on the command-check mount; never shown before the review. Same format and authoring rules as quiz.yaml.
version: 1
check: models-effort-quiz
passBar: "passScore 0.8: at least 5 of 6 correct, exact set match per question"
questions:
  - id: subagent-effort
    type: single
    prompt: |
      Оркестратор на сильной модели раздаёт сабагентам простые поиски по репозиторию: найти файл,
      вернуть путь. Сабагенты работают на том же высоком уровне усилия и тормозят. Что разумно?
    options:
      - { id: a, text: "Поднять усилие оркестратора, чтобы он давал сабагентам точнее задания" }
      - { id: b, text: "Снизить усилие сабагентов: их задачи простые и не требуют рассуждения" }
      - { id: c, text: "Оставить как есть: высокое усилие всегда даёт более надёжный поиск" }
      - { id: d, text: "Убрать сабагентов и пусть оркестратор читает все файлы сам целиком" }
    correct: [b]
    explanation: |
      Effort подбирается под задачу: для простых и массовых задач, в том числе сабагентов,
      страница effort советует низкие уровни. Высокое усилие на поиске файла тратит токены и время
      без выигрыша в качестве.

  - id: vendor-effort-names
    type: single
    prompt: |
      Коллега переносит конфиг из одного агентного CLI в другой и хочет просто заменить "High" на
      "high", раз названия уровней совпадают. Что не так в этом подходе?
    options:
      - { id: a, text: "Ничего: уровни усилия стандартизованы у всех вендоров одинаково" }
      - { id: b, text: "Уровни надо переводить в токены, а токены у вендоров одинаковые" }
      - { id: c, text: "Названия похожи, но смысл и набор уровней у вендоров свой" }
      - { id: d, text: "Уровни усилия существуют только у одного вендора, у других нет" }
    correct: [c]
    explanation: |
      Шкалы усилия у вендоров разные: другой набор уровней и другое поведение за одинаковым
      словом (в теории датированный пример Codex). Сопоставлять их один к одному нельзя: смотреть
      документацию конкретного инструмента и проверять на своих задачах.

  - id: price-per-task
    type: single
    prompt: |
      Модель B в пять раз дешевле модели A за токен. На вашей задаче B делает в восемь раз больше
      ходов, каждый ход отправляет растущий контекст. Какой вывод верен?
    options:
      - { id: a, text: "Задача на B может обойтись дороже: считать надо цену задачи, а не токена" }
      - { id: b, text: "B всегда дешевле, ведь цена токена в пять раз ниже, чем у модели A" }
      - { id: c, text: "Цены нельзя сравнить, пока обе модели не выдадут одинаковый ответ" }
      - { id: d, text: "Число ходов на цену не влияет, влияет только длина финального ответа модели" }
    correct: [a]
    explanation: |
      Каждый ход заново отправляет весь контекст, поэтому больше ходов означает больше токенов на
      задачу. Сравнивают цену задачи (токены всех ходов умножить на цены), а не цену токена.

  - id: privacy-binding
    type: single
    prompt: |
      Задача: объяснить внутренний модуль. Политика компании запрещает отправлять код наружу, всё
      остальное (время, бюджет) не ограничено. Какое ограничение определяет выбор запуска?
    options:
      - { id: a, text: "Качество: раз время не ограничено, нужна самая сильная модель" }
      - { id: b, text: "Цена: локальный запуск дешевле любого облачного варианта" }
      - { id: c, text: "Контекст: модуль большой, поэтому нужен самый большой контекст из всех" }
      - { id: d, text: "Приватность: код не может покинуть машину, значит локальный запуск" }
    correct: [d]
    explanation: |
      Жёсткое ограничение здесь одно: код нельзя отправлять во внешние сервисы. Оно исключает
      облако, остальное ослаблено. Довод "локально дешевле" - заблуждение, а не причина.

  - id: local-model-failures
    type: multiple
    prompt: |
      Вы подключили агента к локальной модели через совместимый эндпоинт. Какие поломки типичны для
      такого запуска? Выберите все верные.
    options:
      - { id: a, text: "Определения инструментов и история не помещаются в маленькое окно" }
      - { id: b, text: "Модель выдаёт вызовы инструментов в неверном формате или не вызывает их" }
      - { id: c, text: "Харнесс перестаёт проверять разрешения, потому что сама модель локальная" }
      - { id: d, text: "Длинная задача ломается, когда контекст переполняется на середине" }
    correct: [a, b, d]
    explanation: |
      Типичные поломки локального запуска - маленькое окно (не помещаются определения
      инструментов, история, длинные задачи) и слабое умение вызывать инструменты. Проверка
      разрешений - работа харнесса, она не зависит от того, где запущена модель.

  - id: check-before-choosing
    type: multiple
    prompt: |
      Вы выбираете уровень усилия для новой модели в новом инструменте. Какие действия отражают
      правильную привычку? Выберите все верные.
    options:
      - { id: a, text: "Посмотреть рекомендации по усилию для этой модели в её документации" }
      - { id: b, text: "Проверить, какой уровень реально стоит в этом инструменте сейчас" }
      - { id: c, text: "Взять уровень, который был дефолтом у прошлой модели в другом CLI" }
      - { id: d, text: "Сравнить пару уровней на своих задачах, прежде чем закрепить выбор" }
    correct: [a, b, d]
    explanation: |
      Дефолты и рекомендации различаются по моделям и поверхностям и меняются со временем.
      Привычка: документация модели, фактическая настройка инструмента и проверка на своих задачах
      (для Opus 5.5 документация прямо просит прогон уровней на своих evals).
