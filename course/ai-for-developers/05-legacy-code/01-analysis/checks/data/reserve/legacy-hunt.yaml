    4 | ## Сессия: план тестов для quote и меток
    5 |
    6 | > Продолжим с тестов. Что нужно, чтобы зафиксировать quote_parcel?
    7 |
    8 | ● Read(shipping/quote.py)
    9 |   ⎿ (115 строк) quote_parcel и его помощники: _bracket_price, _services_price, _insurance,
   10 |   ⎿ _ship_date, _next_business_day, _holidays, _saturday_surcharge.
   11 | ● quote_parcel зависит только от своих аргументов: веса, индекса, услуг и объявленной
   12 | ●   стоимости. Значит, хватит таблицы входов и одного ожидаемого итога на каждую строку,
   13 | ●   без подмен в тесте.
   14 | ● Страховка _insurance(declared_value_kopecks) тоже зависит только от аргумента:
   15 | ●   минимальный сбор задан в самой функции, round считает от объявленной стоимости.
   16 | > А дата отгрузки на метке как считается?
   17 | ● Read(README.md)
   18 |   ⎿ (34 строки) ... A parcel quoted at or after the cut-off hour ships on the next business
   19 |   ⎿ day. Public holidays are listed in data/holidays.txt. ...
   20 | ● По README после часа отсечки посылка уходит на следующий рабочий день, а праздники берутся
   21 | ●   из data/holidays.txt. Так и на метке: дата отгрузки на метке после 15:00 пропускает
   22 | ●   выходные и праздники.
   23 | ● Docstring shipping/config.py говорит, что настройки читаются один раз, при первом импорте,
   24 | ●   и изменение ini или SHIPPING_SPOOL после этого не действует до перезапуска процесса.
   25 | ●   Код так и устроен: CUTOFF_HOUR, FUEL_PERCENT и SPOOL_DIR вычисляются на уровне модуля.
   26 | > На складе иногда отменяют метки. Это можно проверять на их спуле?
   27 | ● Read(shipping/labels.py, offset=33, limit=7)
   28 |   ⎿ 33 def void_label(seq):
   29 |   ⎿ 34     """Mark the label with number seq as void. A void label stays in the spool."""
   30 |   ⎿ 35     path = config.SPOOL_DIR / f"{seq:06d}.lbl"
   31 |   ⎿ 36     if not path.is_file():
   32 |   ⎿ 37         raise ValueError(f"label {seq:06d} is not in the spool {config.SPOOL_DIR}")
   33 |   ⎿ .. (строки 38-39)
   34 | ● void_label только проверяет, что файл метки есть в спуле, и бросает ValueError, если его
   35 | ●   нет. Спул она не меняет, так что вызывать её на настоящем спуле склада безопасно.
   36 | ● quote._holidays тоже только читает: открывает data/holidays.txt на чтение и собирает
