# Answer key for legacy-hunt (design #45 6.1, format as module 01 L6 bugs.yaml).
# Hidden: grader mount only. Line numbers are 1-based physical lines of transcript.md and equal the
# printed numbers. Generated together with the transcript; ranges are pairwise non-overlapping.
# Every range is a separate guessable block: 6 bugs over 7 ranges and 26 decoys. Per category
# ranges/(ranges + decoys): unsafe-exploration 1/6, missed-dynamic-use 1/4, bug-called-fix 2/9,
# missed-hidden-input 1/6, missed-side-effect 1/4, doc-over-code 1/4.
# Harness event (line 280: auto-compaction) lies in no range. Line 57 (the format
# example in task.md, a user line) lies in no range.
# Student round 1: bugs and decoys are written alike. Every claim of a category uses the same wording
# ("нигде не используется ... можно удалить", "зависит только от аргумента", "нет побочных эффектов ...
# безопасно", "<doc> говорит ..., так что ..."); no decoy says it checked the code when the bug does not;
# user pushback follows a decoy (D5a, D3f), not a bug; no command output or summary names a planted place.
# Student rerun a2: no command output or summary settles a decoy or points at a bug by itself.
# Final round (D13, after the blind reader passed on cues alone): the bug of two categories moved to an
# episode that domain sense does not single out, and each old bug episode became a correct episode of the
# same subject. unsafe-exploration: the successful `label` run is gone; the bug is a direct call of
# labels._next_sequence (writes spool/.seq), beside a direct call of labels._tracking_code (writes nothing)
# whose output looks just as much like a label artifact; the only `label` run is D1c, which fails before
# make_label. missed-hidden-input: the bug is tariffs.zone_for "only postcode" (reads _TABLE and
# data/tariffs.csv); make_label is now described correctly (D4e), and the file readers load_table and
# _read_label, which look impure, are pure in the ladder's sense (D4a, D4d). missed-dynamic-use: the
# `cut -f1-3 data/tariffs.csv` that hid the resolver column is gone, and so are the statements that the
# current scheme covers only postcodes 1-5. bug-called-fix: D3g is a behaviour change in live code that
# is a real bug fix (labels._surcharges_line drops repeated services and has hash order) and that no code
# relies on; the manifest summary no longer lists the label fields it uses.
# State (task.md): files and directories on disk except __pycache__/.pyc, and everything outside the
# Python process. Module variables, in-memory caches and imports are hidden inputs, not state.
# Ladder (task.md), first 'yes' decides: 1 unsafe-exploration, 2 missed-dynamic-use, 3 bug-called-fix,
# 4 missed-hidden-input, 5 missed-side-effect, 6 doc-over-code. Every 'no' below is decided from a
# starter file (parcel-desk master, line numbers as in plans/45-p0-report.md).
version: 1
report: findings.json
maxReports: 7
maxDecoyHits: 1
categories: [unsafe-exploration, missed-dynamic-use, bug-called-fix, missed-hidden-input, missed-side-effect, doc-over-code]
