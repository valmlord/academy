    explanation: "manifest.py строки 21-24 пишут CSV, строки 38-39 переименовывают обработанные метки в .done. Запуск на настоящем спуле меняет его; снимать golden нужно на копии спула во временном каталоге."
  # Walk (H6, readme-daily-numbers):
  #   1-5 no: a statement of behaviour from README, no command, no change, no dependency or side-effect claim
  #   6 yes: README.md line 27 says numbers restart daily; labels._next_sequence keeps one global counter in spool/.seq
  - id: readme-daily-numbers
    file: transcript.md
