    title: "По README номера меток каждый день начинаются заново, а код ведёт один сквозной счётчик в spool/.seq."
    explanation: "labels._next_sequence читает и пишет spool/.seq без связи с датой (строки 42-53); README.md строка 27 устарел. Утверждение о поведении проверяют по коду, а не по README."
