name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: the build traced nothing from course/
        run: bash apps/web/scripts/check-build-course.sh
      - name: fail if the build changed tracked files
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then echo "$changes"; git --no-pager diff; exit 1; fi

  content:
    name: lesson contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate
      # The fixture root the several-course e2e serves (#241) passes the same validation as course/.
      - run: pnpm --filter @academy/lesson-schema run validate ../../tests/fixtures/course-root

  # No path filter: a lesson-schema PR that adds a check kind must turn the drift step red (ADR-0007).
  db:
    name: db migrations and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The runner VM is discarded after the job, so the reaper has nothing to clean up.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit plus both parents, for the append-only step.
          fetch-depth: 2
          # The job runs PR code (drizzle-kit loads schema.ts); nothing after checkout needs the token.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: applied migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash packages/db/scripts/check-append-only.sh
      # drizzle-kit loads schema.ts, which imports lesson-schema's dist/.
      - run: pnpm exec turbo run build --filter='@academy/db^...'
      - run: pnpm --filter @academy/db run db:check
      - name: migrations match the schema
        # A backstop only: drizzle-kit without a TTY exits instead of waiting for a prompt.
        timeout-minutes: 3
        run: bash packages/db/scripts/check-drift.sh
      - run: pnpm test:integration

  design:
    name: design tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/design -v
      # Required from the first DESIGN task on (ADR-0006); until tokens.css exists the skip is printed.
      - run: |
          if [ -f design/system/tokens.css ]; then
            python3 -I scripts/design_tokens.py check design
          else
            echo "design/system/tokens.css not present yet: token checks skipped"
          fi

  # Its own job, because PEP 668 refuses pip installs into the runner's system Python, and setup-python
  # would replace the python3 that job design runs the tests on.
  design-types:
    name: design validator types
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --no-deps --only-binary :all:
          -r tests/design/requirements-typecheck.txt
      # The test imports design_tokens from scripts/; the cache stays outside the repo.
      - run: >-
          MYPYPATH=scripts python -m mypy --strict --python-version 3.9
          --cache-dir "$RUNNER_TEMP/mypy-cache" scripts/design_tokens.py tests/design/test_design_tokens.py

  e2e:
    name: compose stack and Playwright e2e
    runs-on: ubuntu-24.04
    # The terminal specs start workspace containers and run after every other spec (#32 design 10.5); the job
    # also builds the workspace image the lessons name (#33).
    timeout-minutes: 30
    env:
      # db is unpublished by default (ADR-0002 item 6); the seed step reaches it on the host port the override adds.
      COMPOSE_FILE: docker-compose.yml:compose.db-port.yaml
      # Not the owner's project or port, so the destructive specs' origin check treats this stack like any
      # disposable one (#96).
      COMPOSE_PROJECT_NAME: academy-ci
      WEB_PORT: "53082"
    steps:
      - uses: actions/checkout@v4
        with:
          # The job never pushes; the token would otherwise sit in .git/config while images build and run.
          persist-credentials: false
      # WEB_PORT comes from the job env only. With a WEB_PORT line in the root .env, a Playwright step called
      # directly has the job's WEB_PORT in its env, the decision compares it with the base URL's port, and it
      # refuses this stack (disposable-stack.ts:51-58).
      - run: grep -v '^WEB_PORT=' .env.example > .env
      - name: generate the auth and workspace service secrets
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          printf 'BETTER_AUTH_SECRET=%s\n' "$secret" >> .env
          service_secret=$(openssl rand -hex 32)
          echo "::add-mask::$service_secret"
          printf 'WORKSPACE_SERVICE_SECRET=%s\n' "$service_secret" >> .env
      - run: docker compose config --quiet
      # The network probe's helper container runs it.
      - run: docker pull node:22.23.4-alpine
      - name: build the workspace image the lessons name
        timeout-minutes: 15
        shell: bash
        run: bash scripts/build-workspace-image.sh academy-workspace:dev
      # #201: an added or removed interface address can make Chromium flush its socket pools (ERR_NETWORK_CHANGED).
      # Interfaces created in the runner's (host) network namespace from here on (bridges and host-side veths) get no
      # IPv6, so a workspace veth that comes up adds no fe80:: address there. The setting is per namespace: container
      # namespaces keep their own. `default`, not `all`: `all` would also take ::1 off lo and IPv6 off eth0.
      - name: no IPv6 on interfaces created in the runner's (host) network namespace from here on
        run: sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose ps
      # P7: root without capabilities can use the mounted socket. 404 workspace-not-found means the service asked
      # Docker and got an answer; 503 means it could not reach the socket. The secret stays in the container.
      - name: workspace service reaches Docker
        run: docker compose exec -T workspace node --input-type=module - reach < services/workspace/test/network/api.mjs
      - name: workspace network isolation
        run: bash services/workspace/test/network/probe-isolation.sh academy-ci local --rows all
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migrations run inside the built image
        run: bash apps/web/scripts/check-image-migrations.sh
      # No host dist/ exists yet, so a green step also proves the seed task builds its workspace imports.
      # 127.0.0.1, not .env's localhost: compose.db-port.yaml publishes on 127.0.0.1 only and Node may try ::1 first.
      - name: seed the e2e user
        timeout-minutes: 3
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          { echo "SEED_EMAIL=learner@example.com"; echo "SEED_PASSWORD=$pw"; } >> "$GITHUB_ENV"
          DATABASE_URL=postgres://academy:academy@127.0.0.1:5432/academy SEED_EMAIL=learner@example.com SEED_PASSWORD="$pw" pnpm seed | tee seed.log
          grep -qF 'seed: created' seed.log
      - name: the image holds only the learner-visible course files
        run: bash apps/web/scripts/check-image-course.sh
      - run: pnpm --filter @academy/web exec playwright install --with-deps --only-shell chromium
      # #201: the netlink guard covers every Playwright step below (scripts/netlink-guard.sh).
      - id: netlink_guard
        name: start the netlink guard
        timeout-minutes: 2
        run: bash scripts/netlink-guard.sh start netlink.log "$RUNNER_TEMP/netlink.pid"
      # E2E_TERMINAL runs the specs that type into a terminal (D12); E-echo reads lesson_progress through the
      # host port compose.db-port.yaml publishes. E2E_DISPOSABLE_STACK allows the spec that resets a working
      # folder: this stack is thrown away after the job (#106).
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:53082
          E2E_TERMINAL: "1"
          E2E_DISPOSABLE_STACK: "1"
          DATABASE_URL: postgres://academy:academy@127.0.0.1:5432/academy
      # Delta 5: a Next-logged server error during the suite is a failure even when every spec passed. D1 (no
      # __NEXT_PRIVATE_ORIGIN) left sign-out green but logged SessionReadError. Runs before service-down, which
      # makes web log errors on purpose.
      - name: web logged no server error during e2e
        run: |
          docker compose logs --no-color web > "$RUNNER_TEMP/web-e2e.log"
          if ! grep -qF 'web: database migrations applied' "$RUNNER_TEMP/web-e2e.log"; then
            echo "web log lacks \"web: database migrations applied\"; the guard did not read this stack's web log"
            exit 1
          fi
          if grep -nF -e '⨯' -e 'Error [' "$RUNNER_TEMP/web-e2e.log"; then
            echo "web logged a server error during the e2e run (matching lines above)"
            exit 1
          fi
      # #96: the lesson page while course.yaml cannot be read. Called directly, not through turbo, whose strict env
      # would drop E2E_COURSE_UNREADABLE and E2E_COMPOSE_PROJECT (turbo.json test:e2e passThroughEnv). The spec
      # changes only a web container of the compose project E2E_COMPOSE_PROJECT names.
      - id: course_unreadable
        name: course-unreadable e2e
        run: pnpm --filter @academy/web exec playwright test e2e/course-unreadable.spec.ts --project=chromium --workers=1 --output test-results/course-unreadable --reporter=github,json
        env:
          E2E_BASE_URL: http://127.0.0.1:53082
          E2E_DISPOSABLE_STACK: "1"
          E2E_COURSE_UNREADABLE: "1"
          E2E_COMPOSE_PROJECT: academy-ci
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/course-unreadable.json
      # Whatever the spec did, service-down below needs a course the web user can read again.
      - name: course.yaml readable again
        if: always() && steps.course_unreadable.outcome != 'skipped'
        run: |
          docker compose exec -u 0 -T web sh -c 'chmod a+r /app/course/*/course.yaml'
          docker compose exec -T web sh -c 'cat /app/course/*/course.yaml >/dev/null'
      - name: course-unreadable report counts
        if: always() && steps.course_unreadable.outcome != 'skipped'
        run: |
          node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).stats; console.log("course-unreadable stats: expected="+s.expected+" unexpected="+s.unexpected+" skipped="+s.skipped+" flaky="+s.flaky)' apps/web/test-results/course-unreadable.json
      # D5: with the workspace service stopped the site still works and the lesson says the start failed.
      - run: docker compose stop workspace
      - run: pnpm --filter @academy/web exec playwright test e2e/service-down.spec.ts --project=chromium --output test-results/service-down
        env:
          E2E_BASE_URL: http://127.0.0.1:53082
          E2E_SERVICE_DOWN: "1"
      - name: no interface address changed while Playwright ran
        if: always() && steps.netlink_guard.outcome == 'success'
        run: bash scripts/netlink-guard.sh check netlink.log "$RUNNER_TEMP/netlink.pid"
      - if: failure()
        run: |
          docker compose ps -a > compose-ps.txt
          docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            compose.log
            compose-ps.txt
            netlink.log
          retention-days: 7
      - name: disk usage (on failure or cancel)
        if: failure() || cancelled()
        shell: bash
        run: df -h / && docker system df
      # Safe here only: the runner is ephemeral and this job created the volume.
      - if: always()
        run: docker compose down -v
