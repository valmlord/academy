name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  content:
    name: lesson contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate

  pipeline:
    name: agent pipeline hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S error .claude/hooks/*.sh .claude/hooks/lib/*.sh tests/pipeline/run.sh
      - run: python3 -m py_compile .claude/hooks/lib/*.py
      - run: bash tests/pipeline/run.sh

  # Its own job, because PEP 668 refuses pip installs into the runner's system Python.
  pipeline-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --no-deps --only-binary :all:
          -r tests/pipeline/requirements-typecheck.txt
      # mypy runs on 3.12 but checks against the hooks' 3.9 runtime; the cache stays outside the repo.
      - run: >-
          MYPYPATH=.claude/hooks/lib python -m mypy --strict --python-version 3.9
          --cache-dir "$RUNNER_TEMP/mypy-cache" .claude/hooks/lib/*.py
      # A separate invocation: the validator and its test resolve imports from scripts/, not the hook lib.
      - run: >-
          MYPYPATH=scripts python -m mypy --strict --python-version 3.9
          --cache-dir "$RUNNER_TEMP/mypy-cache-design" scripts/design_tokens.py tests/design/test_design_tokens.py

  design:
    name: design tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/design -v
      # Required from the first DESIGN task on (ADR-0006); until tokens.css exists the skip is printed.
      - run: |
          if [ -f design/system/tokens.css ]; then
            python3 -I scripts/design_tokens.py check design
          else
            echo "design/system/tokens.css not present yet: token checks skipped"
          fi

  compose:
    name: docker compose stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: docker compose ps
      - if: always()
        run: docker compose down -v

  # e2e (Playwright) job is added together with apps/web (backlog: web bootstrap).
