name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: fail if the build changed tracked files
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then echo "$changes"; git --no-pager diff; exit 1; fi

  content:
    name: lesson contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate

  # No path filter: a lesson-schema PR that adds a check kind must turn the drift step red (ADR-0007).
  db:
    name: db migrations and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The runner VM is discarded after the job, so the reaper has nothing to clean up.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit plus both parents, for the append-only step.
          fetch-depth: 2
          # The job runs PR code (drizzle-kit loads schema.ts); nothing after checkout needs the token.
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: applied migrations are append-only
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash packages/db/scripts/check-append-only.sh
      # drizzle-kit loads schema.ts, which imports lesson-schema's dist/.
      - run: pnpm exec turbo run build --filter='@academy/db^...'
      - run: pnpm --filter @academy/db run db:check
      - name: migrations match the schema
        # A backstop only: drizzle-kit without a TTY exits instead of waiting for a prompt.
        timeout-minutes: 3
        run: bash packages/db/scripts/check-drift.sh
      - run: pnpm test:integration

  pipeline:
    name: agent pipeline hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S error .claude/hooks/*.sh .claude/hooks/lib/*.sh tests/pipeline/run.sh
      - run: python3 -m py_compile .claude/hooks/lib/*.py
      - run: bash tests/pipeline/run.sh

  # Its own job, because PEP 668 refuses pip installs into the runner's system Python.
  pipeline-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --no-deps --only-binary :all:
          -r tests/pipeline/requirements-typecheck.txt
      # mypy runs on 3.12 but checks against the hooks' 3.9 runtime; the cache stays outside the repo.
      - run: >-
          MYPYPATH=.claude/hooks/lib python -m mypy --strict --python-version 3.9
          --cache-dir "$RUNNER_TEMP/mypy-cache" .claude/hooks/lib/*.py
      # A separate invocation: the validator resolves from scripts/; the hook lib is there for the test's
      # import of hookio, whose verdict parser the validator output must never trigger.
      - run: >-
          MYPYPATH=scripts:.claude/hooks/lib python -m mypy --strict --python-version 3.9
          --cache-dir "$RUNNER_TEMP/mypy-cache-design" scripts/design_tokens.py tests/design/test_design_tokens.py

  design:
    name: design tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/design -v
      # Required from the first DESIGN task on (ADR-0006); until tokens.css exists the skip is printed.
      - run: |
          if [ -f design/system/tokens.css ]; then
            python3 -I scripts/design_tokens.py check design
          else
            echo "design/system/tokens.css not present yet: token checks skipped"
          fi

  e2e:
    name: compose stack and Playwright e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The job never pushes; the token would otherwise sit in .git/config while images build and run.
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose ps
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migrations run inside the built image
        run: bash apps/web/scripts/check-image-migrations.sh
      - run: pnpm --filter @academy/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3080
      - if: failure()
        run: |
          docker compose ps -a > compose-ps.txt
          docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            compose.log
            compose-ps.txt
          retention-days: 7
      # Safe here only: the runner is ephemeral and this job created the volume.
      - if: always()
        run: docker compose down -v
