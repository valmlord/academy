name: workspace image

on:
  pull_request:
    paths:
      - images/workspace/**
      - scripts/build-workspace-image.sh
      - services/workspace/src/docker/spec.ts
      - .github/workflows/workspace-image.yml
  push:
    branches: [main]
    paths:
      - images/workspace/**
      - scripts/build-workspace-image.sh
      - services/workspace/src/docker/spec.ts
      - .github/workflows/workspace-image.yml

concurrency:
  group: workspace-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# An explicit bash shell runs every step with -eo pipefail; GitHub's default is bash -e without pipefail.
defaults:
  run:
    shell: bash

jobs:
  image:
    name: workspace image build, smoke, layer scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Same pins as job design-types; setup-python replaces python3 for the scan too, which needs only the stdlib.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --no-deps --only-binary :all:
          -r tests/design/requirements-typecheck.txt
      - run: >-
          MYPYPATH=images/workspace/test python -m mypy --strict --python-version 3.9
          --cache-dir "$RUNNER_TEMP/mypy-cache" images/workspace/test/scan_layers.py images/workspace/test/test_scan_layers.py
      - run: python3 -m unittest discover -s images/workspace/test -v
      - name: plant canaries in the build context
        run: |
          canary="academy-canary-$(openssl rand -hex 16)"
          [[ $canary =~ ^academy-canary-[0-9a-f]{32}$ ]] || exit 1
          echo "::add-mask::$canary"
          echo "CANARY=$canary" >> "$GITHUB_ENV"
          printf 'ANTHROPIC_API_KEY=%s\n' "$canary" > images/workspace/.env
          printf '//registry.npmjs.org/:_authToken=%s\n' "$canary" > images/workspace/.npmrc
          printf '%s\n' "$canary" > images/workspace/test/canary.txt
      - name: build and smoke-test the image, with the canary in the build environment
        timeout-minutes: 15
        run: ANTHROPIC_API_KEY="$CANARY" NPM_TOKEN="$CANARY" bash scripts/build-workspace-image.sh academy-workspace:ci
      - name: no canary in any layer, the history or the config; size within budget
        run: python3 -I images/workspace/test/scan_layers.py academy-workspace:ci "$CANARY"
      - name: claude reads ANTHROPIC_API_KEY from the environment
        run: bash images/workspace/test/smoke.sh academy-workspace:ci --key-test
      - name: disk usage (on failure or cancel)
        if: failure() || cancelled()
        run: df -h / && docker system df
