name: Feature (platform)
description: New platform capability, handled by the dev team pipeline
title: "feat: "
labels: ["type:feature", "team:dev"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user story
      description: "Как ученик, я хочу ..., чтобы ..."
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable. Each one becomes a test.
      value: |
        - [ ]
    validations: { required: true }
  - type: dropdown
    id: tier
    attributes:
      label: Pipeline tier
      options: [TASK, PROJECT, PIPELINE, LEARN, HOTFIX]
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, workspace, db, infra, content-tooling, pipeline]
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Notes, links, ADRs
