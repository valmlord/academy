name: Bug
description: Something does not work as expected
title: "fix: "
labels: ["type:bug", "team:dev"]
body:
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs / screenshots, render: shell }
