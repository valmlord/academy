<!doctype html>
<html lang="en" data-theme-fixed>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design system v1: component gallery</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="proto.css">
  <style>
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 36rem), 1fr)); }
    .gallery-col { padding: var(--space-6) var(--space-4); background: var(--background); color: var(--foreground); }
    .gallery-col > h2 { margin-bottom: var(--space-6); }
    .gallery-section { display: flex; flex-direction: column; gap: var(--space-3); padding-bottom: var(--space-8); }
    .gallery-section > h3 { font-size: var(--text-sm); line-height: var(--text-sm-line); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.04em; }
    .gallery-note { font-size: var(--text-xs); line-height: var(--text-xs-line); color: var(--muted-foreground); }
    /* position: relative makes the demo the containing block of its .sr-only headings (position: absolute),
       so its overflow clips them too; otherwise the two-pane demo's environment heading widens the page. */
    .demo-layout { position: relative; height: 30rem; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }
    /* The forced two-pane demo is wider than a 320px column: it scrolls sideways inside its own box. */
    .demo-scroll-x { overflow-x: auto; }
    .demo-layout-short { height: 26rem; }
    .demo-narrow { max-width: 20rem; border: 1px solid var(--border); border-radius: var(--radius-lg); }
    /* The page h1 at its own size, inside the gallery's heading outline (h2 column, h3 section). */
    .gallery-h1 { font-size: var(--text-2xl); line-height: var(--text-2xl-line); }
    /* Attempt rows: the part headings at the pages' size, text-lg (dashboard h2 by its page CSS, lesson
       h3 by proto.css), inside the gallery outline that demotes them to h4. */
    .gallery-part-heading { font-size: var(--text-lg); line-height: var(--text-lg-line); }
    /* Attempt rows: the 32px between parts on both pages (each part's page margin-top space-4 on the
       16px gap of its parent); this is page layout, so it is not a proto.css piece. */
    .gallery-parts { gap: var(--space-8); }
    /* The quiz panel h2 and the question h3 at their page sizes. */
    .gallery-h2 { font-size: var(--text-xl); line-height: var(--text-xl-line); }
    .gallery-h3 { font-size: var(--text-lg); line-height: var(--text-lg-line); }
    /* The explanation h4, one level down in the gallery outline: the base h4 look (text-base, 600). */
    .gallery-h4 { margin: 0; font-size: var(--text-base); line-height: var(--text-base-line); font-weight: 600; }
  </style>
</head>
<body>
<header class="page stack" data-gap="2">
  <h1>Design system v1: component gallery</h1>
  <p class="muted">Every component of the inventory in <code>design/system/README.md</code> and every composition, light on the left (or on top), dark on the right. Russian text is UI copy. Opens by double-click; nothing loads from the network.</p>
</header>

<div class="gallery">
  <section class="gallery-col" data-gallery-col="light" aria-labelledby="col-light"><h2 id="col-light">Light</h2></section>
  <section class="gallery-col dark" data-gallery-col="dark" aria-labelledby="col-dark"><h2 id="col-dark">Dark</h2></section>
</div>

<template id="gallery-content">
  <div class="gallery-section">
    <h3>Button</h3>
    <div class="row" lang="ru">
      <button class="button" type="button">Войти</button>
      <button class="button" type="button" data-variant="secondary">Повторить</button>
      <button class="button" type="button" data-variant="outline">Отмена</button>
      <button class="button" type="button" data-variant="ghost">Подробности</button>
      <button class="button" type="button" data-variant="link">Открыть курс</button>
      <button class="button" type="button" data-variant="destructive">Сбросить</button>
      <button class="button" type="button" data-size="sm">Проверить</button>
    </div>
    <div class="row" lang="ru">
      <button class="button" type="button" aria-disabled="true" aria-busy="true"><span class="spinner" aria-hidden="true"></span>Входим...</button>
      <button class="button" type="button" aria-disabled="true" aria-describedby="g-reason-check">Проверить</button>
      <span class="disabled-reason" id="g-reason-check">Окружение запускается, проверка станет доступна после запуска</span>
    </div>
    <p class="gallery-note">Variants: default, secondary, outline, ghost, link, destructive; sizes default, sm, icon. Disabled is always aria-disabled with a visible reason (R1), never the native attribute. A busy button is aria-busy plus aria-disabled, with the busy label as its reason (R1); its cursor is progress.</p>
  </div>

  <div class="gallery-section">
    <h3>Card, Field, Label, Input</h3>
    <form class="card" lang="ru" novalidate onsubmit="return false">
      <div class="card-header">
        <h4 class="card-title">Вход</h4>
        <p class="card-description">Вы вышли</p>
      </div>
      <div class="field">
        <label class="label" for="g-email">Почта</label>
        <input class="input" id="g-email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label class="label" for="g-password">Пароль</label>
        <input class="input" id="g-password" type="password" aria-invalid="true" aria-describedby="g-password-error">
        <p class="field-error" id="g-password-error">Введите пароль</p>
      </div>
      <div class="card-footer"><button class="button" type="submit">Войти</button></div>
    </form>
  </div>

  <div class="gallery-section">
    <h3>RadioGroup and Checkbox</h3>
    <div class="stack" data-gap="6" lang="ru">
      <div class="question">
        <h4 class="gallery-h3" id="g-rq1-heading">Вопрос 1 из 6</h4>
        <div class="choice-group" role="radiogroup" aria-labelledby="g-rq1-heading">
          <label class="choice"><input class="radio" type="radio" name="g-rq1"><span class="choice-text">Только длину скрытого рассуждения перед финальным ответом пользователю</span></label>
          <label class="choice"><input class="radio" type="radio" name="g-rq1" checked><span class="choice-text">Расход токенов на весь вывод модели, включая вызовы инструментов</span></label>
        </div>
      </div>
      <div class="question">
        <h4 class="gallery-h3" id="g-rq5-heading">Вопрос 5 из 6</h4>
        <div class="choice-group" role="group" aria-labelledby="g-rq5-heading">
          <label class="choice"><input class="checkbox" type="checkbox" checked><span class="choice-text">Увеличить окно контекста модели в настройках локального сервера</span></label>
          <label class="choice"><input class="checkbox" type="checkbox"><span class="choice-text">Поднять уровень усилия, чтобы модель лучше запоминала инструменты</span></label>
        </div>
      </div>
      <div class="question">
        <h4 class="gallery-h3" id="g-rq2-heading">Вопрос 2 из 6</h4>
        <div class="choice-group" role="radiogroup" aria-labelledby="g-rq2-heading" aria-disabled="true">
          <label class="choice"><input class="radio" type="radio" name="g-rq2" aria-disabled="true"><span class="choice-text">Дописать в промпт просьбу думать тщательнее и повторить запуск</span></label>
          <label class="choice"><input class="radio" type="radio" name="g-rq2" aria-disabled="true" checked><span class="choice-text">Проверить, какое усилие реально выставлено в этой поверхности</span></label>
        </div>
      </div>
    </div>
    <p class="gallery-note">Native inputs drawn as shadcn's RadioGroupItem and Checkbox (size-4): boundary --input; a checked radio keeps that border and gets the --primary dot, a checked checkbox turns --primary with the check mark (lucide CheckIcon in the app, a glyph here); checkbox corners --radius-sm; the 2px --ring focus ring. Departures from upstream: README "Quiz panel". The label wraps the control and its text, so the whole label is the target, at least 24px tall. Third group: locked while sending, aria-disabled on the group and every option; the look does not change (only the cursor), click, Space and the arrow keys change nothing, and the options stay in the Tab order. On the page the heading is the question h3 (here h4 in the gallery outline).</p>
  </div>

  <div class="gallery-section">
    <h3>Alert</h3>
    <div class="alert" lang="ru">
      <span class="status-icon" data-status="info" aria-hidden="true"></span>
      <p class="alert-title">Окружение остановится через 5 мин без активности. Файлы сохранятся.</p>
      <div class="alert-actions"><button class="button" type="button" data-size="sm">Продолжить работу</button></div>
    </div>
    <div class="alert" data-variant="destructive" role="group" tabindex="-1" aria-labelledby="g-msg-nouser-title" aria-describedby="g-msg-nouser-description" lang="ru">
      <span class="status-icon" data-status="destructive" aria-hidden="true"></span>
      <p class="alert-title" id="g-msg-nouser-title">Неверная почта или пароль</p>
      <p class="alert-description" id="g-msg-nouser-description">Пользователя создаёт скрипт seed, см. README</p>
    </div>
    <div class="alert" data-variant="warning" lang="ru">
      <span class="status-icon" data-status="warning" aria-hidden="true"></span>
      <p class="alert-title">Сначала пройдите: <a href="#g-prereq">Как устроен агент</a></p>
    </div>
    <p class="gallery-note">Variants: default, destructive (border and title in --destructive), warning (border in --warning, text in --foreground). A message that receives focus instead of a live region (sign-in, ia.md R2) is a div with role="group", tabindex="-1" and aria-labelledby on its title (aria-describedby on its description): a name on a div without a role is not exposed.</p>
  </div>

  <div class="gallery-section">
    <h3>Badge and status icon</h3>
    <div class="row" lang="ru">
      <span class="badge" data-variant="outline" data-tone="muted">Не начат</span>
      <span class="badge" data-variant="secondary">В процессе</span>
      <span class="badge" data-variant="success"><span class="status-icon" data-status="success" aria-hidden="true"></span>Пройден</span>
      <span class="badge" data-variant="outline" data-tone="destructive"><span class="status-icon" data-status="destructive" aria-hidden="true"></span>Не пройден</span>
    </div>
    <div class="row" lang="ru">
      <span class="badge" data-variant="secondary">Доступен</span>
      <span class="badge" data-variant="outline" data-tone="muted">Готовится</span>
      <span class="badge" data-variant="outline">теория</span>
      <span class="badge" data-variant="outline">артефакт</span>
    </div>
    <p class="gallery-note">Check-status badges, deferred: no v1 page draws them (the check rows of Проверки show the status icon and the word, F13.3); they serve no designed page (the dashboard's recent attempts, F18.3, show a status icon and the attempt summary text).</p>
    <div class="row" lang="ru">
      <span class="badge" data-variant="muted"><span class="status-icon" data-status="muted" aria-hidden="true"></span>Не запускалась</span>
      <span class="badge" data-variant="info"><span class="status-icon" data-status="queued" aria-hidden="true"></span>В очереди</span>
      <span class="badge" data-variant="info"><span class="status-icon" data-status="running" aria-hidden="true"></span>Идёт</span>
      <span class="badge" data-variant="success"><span class="status-icon" data-status="success" aria-hidden="true"></span>Пройдено</span>
      <span class="badge" data-variant="outline" data-tone="destructive"><span class="status-icon" data-status="destructive" aria-hidden="true"></span>Не пройдено</span>
      <span class="badge" data-variant="warning"><span class="status-icon" data-status="warning" aria-hidden="true"></span>Время вышло</span>
      <span class="badge" data-variant="warning"><span class="status-icon" data-status="warning" aria-hidden="true"></span>Время вышло, попытка не засчитана</span>
      <span class="badge" data-variant="warning"><span class="status-icon" data-status="warning" aria-hidden="true"></span>Ошибка формата, попытка не засчитана</span>
      <span class="badge" data-variant="warning"><span class="status-icon" data-status="warning" aria-hidden="true"></span>Сбой проверки, попытка не засчитана</span>
      <span class="badge" data-variant="outline" data-tone="destructive"><span class="status-icon" data-status="closed" aria-hidden="true"></span>Закрыта: не пройдено</span>
    </div>
    <div class="row" lang="ru">
      <span class="status-icon" data-status="success" aria-hidden="true"></span>
      <span class="status-icon" data-status="destructive" aria-hidden="true"></span>
      <span class="status-icon" data-status="warning" aria-hidden="true"></span>
      <span class="status-icon" data-status="info" aria-hidden="true"></span>
      <span class="status-icon" data-status="queued" aria-hidden="true"></span>
      <span class="status-icon" data-status="running" aria-hidden="true"></span>
      <span class="status-icon" data-status="running-still" aria-hidden="true"></span>
      <span class="status-icon" data-status="muted" aria-hidden="true"></span>
      <span class="status-icon" data-status="closed" aria-hidden="true"></span>
    </div>
    <p class="gallery-note">Lesson and module status sets of ia.md (v1), check status set (deferred, above). Fail is the outline badge with the destructive icon and word, never filled; a closed check is the same outline badge with the lock. Status icons differ in shape, not only in colour: data-status success, destructive, warning, info, queued, running, running-still, muted, closed (the lock, drawn by CSS on the same empty span). running-still is the motionless form of running, for a snapshot of a run that is not updated: dashboard "Последние попытки", "Идёт проверка"; it keeps the running shape and never spins in any motion setting.</p>
  </div>

  <div class="gallery-section">
    <h3>DropdownMenu</h3>
    <div class="row" lang="ru">
      <div class="dropdown">
        <button class="button" type="button" data-variant="ghost" data-size="sm" id="g-user-menu-trigger" data-menu-trigger aria-haspopup="menu" aria-expanded="false" aria-controls="g-user-menu"><span class="user-email">learner@example.com</span></button>
        <div class="dropdown-menu" id="g-user-menu" role="menu" aria-labelledby="g-user-menu-trigger" data-align="start">
          <div role="group" aria-labelledby="g-user-menu-label">
            <p class="dropdown-label" id="g-user-menu-label" role="presentation">learner@example.com</p>
            <div class="dropdown-separator" role="separator"></div>
            <a class="dropdown-item" role="menuitem" href="#g-sign-in">Выйти</a>
          </div>
        </div>
      </div>
      <div class="dropdown">
        <button class="button" type="button" data-variant="outline" data-size="sm" data-menu-trigger aria-haspopup="menu" aria-expanded="false" aria-controls="g-actions-menu">Действия</button>
        <div class="dropdown-menu" id="g-actions-menu" role="menu" aria-label="Действия" data-align="start">
          <button class="dropdown-item" type="button" role="menuitem" aria-disabled="true" aria-describedby="g-actions-reason-1"><span class="dropdown-item-body">Перезапустить окружение<span class="dropdown-item-reason" aria-hidden="true" id="g-actions-reason-1">Дождитесь окончания проверки</span></span></button>
          <button class="dropdown-item" type="button" role="menuitem" data-dialog-open="g-reset-dialog"><span class="dropdown-item-body">Сбросить рабочую папку</span></button>
          <div class="dropdown-separator" role="separator"></div>
          <button class="dropdown-item" type="button" role="menuitemcheckbox" aria-checked="false"><span class="dropdown-check" aria-hidden="true"></span>Режим для экранного диктора</button>
        </div>
      </div>
    </div>
    <p class="gallery-note">The user menu is named by its trigger (aria-labelledby, the email); a menu owns only items, groups and separators, so .dropdown-label is role="presentation" and names a role="group" around the items it heads. "Выйти" navigates, so it is a link item (a.dropdown-item, no underline). The focused item keeps the 2px ring inset, disabled items included. Disabled items are aria-disabled with the reason as a visible second line, aria-hidden inside the item so the name stays the label alone, and tied to it by aria-describedby only (R1). Arrow keys, Home, End, Esc returns focus to the trigger.</p>
  </div>

  <div class="gallery-section">
    <h3>AlertDialog</h3>
    <div class="row" lang="ru">
      <button class="button" type="button" data-variant="outline" data-dialog-open="g-reset-dialog">Сбросить рабочую папку</button>
    </div>
    <dialog class="alert-dialog" id="g-reset-dialog" role="alertdialog" aria-labelledby="g-reset-title" aria-describedby="g-reset-description" lang="ru">
      <h4 class="alert-dialog-title" id="g-reset-title">Сбросить рабочую папку?</h4>
      <p class="alert-dialog-description" id="g-reset-description">Файлы урока вернутся к исходным, ваши изменения пропадут. Счётчики попыток не обнулятся.</p>
      <div class="alert-dialog-footer">
        <button class="button" type="button" data-variant="outline" data-dialog-close autofocus>Отмена</button>
        <button class="button" type="button" data-variant="destructive" data-dialog-close>Сбросить</button>
      </div>
    </dialog>
    <p class="gallery-note">Focus starts on "Отмена"; Esc cancels; focus returns to the opener (for a menu item, to the menu trigger).</p>
    <div class="check-bar" lang="ru">
      <div class="check-bar-controls"><button class="button" type="button" id="g-budget-check">Проверить</button></div>
    </div>
    <div class="row">
      <button class="button" type="button" data-variant="outline" data-size="sm" id="g-budget-open-one" data-dialog-open="g-budget-dialog-one">Open: one check</button>
      <button class="button" type="button" data-variant="outline" data-size="sm" id="g-budget-open-two" data-dialog-open="g-budget-dialog-two">Open: two checks</button>
    </div>
    <dialog class="alert-dialog" id="g-budget-dialog-one" role="alertdialog" aria-labelledby="g-budget-one-title" aria-describedby="g-budget-one-description g-budget-one-list" data-focus-fallback="#g-budget-check" data-open-in-states="gallery-budget-one" lang="ru">
      <h4 class="alert-dialog-title" id="g-budget-one-title">Потратить до $2.00 с вашего ключа API?</h4>
      <p class="alert-dialog-description" id="g-budget-one-description">Эта проверка расходует токены:</p>
      <ul class="alert-dialog-list" id="g-budget-one-list"><li>Агент решает скрытую задачу с вашим AGENTS.md: до $2.00</li></ul>
      <div class="alert-dialog-footer">
        <button class="button" type="button" data-variant="outline" data-dialog-close autofocus>Отмена</button>
        <button class="button" type="button" data-dialog-close>Запустить</button>
      </div>
    </dialog>
    <dialog class="alert-dialog" id="g-budget-dialog-two" role="alertdialog" aria-labelledby="g-budget-two-title" aria-describedby="g-budget-two-description g-budget-two-list" data-focus-fallback="#g-budget-check" data-open-in-states="gallery-budget-two" lang="ru">
      <h4 class="alert-dialog-title" id="g-budget-two-title">Потратить до $2.50 с вашего ключа API?</h4>
      <p class="alert-dialog-description" id="g-budget-two-description">Эти проверки расходуют токены:</p>
      <ul class="alert-dialog-list" id="g-budget-two-list">
        <li>Качество AGENTS.md (оценка ментора по рубрике): до $0.50</li>
        <li>Агент решает скрытую задачу с вашим AGENTS.md: до $2.00</li>
      </ul>
      <div class="alert-dialog-footer">
        <button class="button" type="button" data-variant="outline" data-dialog-close autofocus>Отмена</button>
        <button class="button" type="button" data-dialog-close>Запустить</button>
      </div>
    </dialog>
    <p class="gallery-note">Budget confirmation (F13.1, sample data from #37 / #39), the second AlertDialog: the list follows the description paragraph as .alert-dialog-list (a ul cannot sit inside the p), both named by aria-describedby; one listed check takes the singular description. "Запустить" is the default variant, not destructive. The dialog's own data-focus-fallback names "Проверить": a page opens it by data-open-in-states, with no opener, so Esc, "Отмена" and a state change that closes it focus "Проверить"; opened by a button (the two above, gallery chrome), focus returns to that button while it is rendered.</p>
  </div>

  <div class="gallery-section">
    <h3>Breadcrumb</h3>
    <nav class="breadcrumb" aria-label="Навигация" lang="ru">
      <ol>
        <li><a href="#g-course">ИИ для разработчиков</a></li>
        <li><a href="#g-module">Введение в разработку с ИИ</a></li>
        <li><span aria-current="page">Модель, уровень ризонинга и локальные модели</span></li>
      </ol>
    </nav>
  </div>

  <div class="gallery-section">
    <h3>Tabs</h3>
    <div class="tabs" lang="ru">
      <div class="tabs-list" role="tablist" aria-label="Разделы урока">
        <button class="tabs-trigger" type="button" role="tab" id="g-tab-theory" aria-controls="g-panel-theory" aria-selected="true">Теория</button>
        <button class="tabs-trigger" type="button" role="tab" id="g-tab-task" aria-controls="g-panel-task" aria-selected="false">Задание</button>
        <button class="tabs-trigger" type="button" role="tab" id="g-tab-checks" aria-controls="g-panel-checks" aria-selected="false">Проверки<span class="status-icon" data-status="running" aria-hidden="true"></span><span class="sr-only">, идёт проверка</span></button>
      </div>
      <div class="tabs-content" role="tabpanel" id="g-panel-theory" aria-labelledby="g-tab-theory" tabindex="0"><p>Текст теории.</p></div>
      <div class="tabs-content" role="tabpanel" id="g-panel-task" aria-labelledby="g-tab-task" tabindex="0"><p>Текст задания.</p></div>
      <div class="tabs-content" role="tabpanel" id="g-panel-checks" aria-labelledby="g-tab-checks" tabindex="0"><p>Список проверок.</p></div>
    </div>
    <p class="gallery-note">Roving tabindex, arrows, Home, End, automatic activation. The selected pill carries a 1px muted-foreground border, not only its surface. The running badge is an icon plus visually hidden text in the tab name.</p>
  </div>

  <div class="gallery-section">
    <h3>Progress</h3>
    <div class="stack" data-gap="2" lang="ru">
      <p class="text-sm" id="g-progress-heading">Пройдено уроков: 2 из 6</p>
      <div class="progress" role="progressbar" aria-labelledby="g-progress-heading" aria-valuemin="0" aria-valuemax="6" aria-valuenow="2" aria-valuetext="2 из 6" style="--progress-value: 33%"><span class="progress-indicator"></span></div>
    </div>
  </div>

  <div class="gallery-section">
    <h3>Item</h3>

<script>
  /* Gallery only: copies the template into both columns and suffixes every id and id reference,
     so the light and dark copies never share an id. */
  (function () {
    var template = document.getElementById("gallery-content");
    // name: a radio group is one per name in a document, so each column's copy needs its own.
    var idAttributes = ["aria-controls", "aria-labelledby", "aria-describedby", "for", "data-tooltip", "data-dialog-open", "name"];
    // data-open-in-states names a state, suffixed like a selector so each column's dialog opens alone.
    var selectorAttributes = ["data-copy", "data-focus", "data-focus-fallback", "data-open-in-states"];
    document.querySelectorAll("[data-gallery-col]").forEach(function (column) {
      var suffix = "-" + column.getAttribute("data-gallery-col");
      var copy = template.content.cloneNode(true);
      copy.querySelectorAll("[id]").forEach(function (el) { el.id += suffix; });
      idAttributes.forEach(function (name) {
        copy.querySelectorAll("[" + name + "]").forEach(function (el) {
          el.setAttribute(name, el.getAttribute(name).trim().split(" ").filter(Boolean).map(function (id) { return id + suffix; }).join(" "));
        });
      });
      selectorAttributes.forEach(function (name) {
        copy.querySelectorAll("[" + name + "]").forEach(function (el) { el.setAttribute(name, el.getAttribute(name) + suffix); });
      });
      // An in-page link to an element of the copy (an error summary link) points at this column's element.
      copy.querySelectorAll("a[href^='#']").forEach(function (link) {
        var target = link.getAttribute("href").slice(1) + suffix;
        if (copy.getElementById(target)) link.setAttribute("href", "#" + target);
      });
      column.appendChild(copy);
    });
  })();
</script>
